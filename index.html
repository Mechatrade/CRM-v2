<style>
  html, body, #root { height: 100%; }
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; background:#F4EFE4; color:#1C1C1A; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8d2c2; border-radius: 8px; }
  .nav-link.active { background: #1F3A2E; color: #fff; }
  .nav-link.active svg { color: #fff; }
  .nav-children { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
  .nav-group.expanded > .nav-children { max-height: 600px; }
  .nav-chevron { transition: transform .2s ease; }
  .nav-group.expanded .nav-chevron { transform: rotate(180deg); }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(2px);} to {opacity:1; transform:translateY(0);} }
  [data-page]:not(.active-page) { display:none; }

  /* Card + primary button — referenced everywhere but never actually
     defined until now. */
  .card {
    background: #fff;
    border: 1px solid #E5E7EB;
    border-radius: 0.5rem;
    box-shadow: 0 1px 3px 0 rgba(28,28,26,0.08), 0 1px 2px -1px rgba(28,28,26,0.06);
  }
  .btn-primary, .btn-glass-sm {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    font-weight: 600;
    color: #15281E;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 14px -2px rgba(31,58,46,0.18), inset 0 1px 0 rgba(255,255,255,0.6);
    transition: all .2s ease;
  }
  .btn-primary { border-radius: 0.5rem; padding: 0.625rem 1rem; font-size: 0.875rem; }
  .btn-glass-sm { border-radius: 0.375rem; padding: 0.375rem 0.75rem; font-size: 0.75rem; box-shadow: 0 3px 10px -2px rgba(31,58,46,0.16), inset 0 1px 0 rgba(255,255,255,0.6); }
  .btn-primary:hover, .btn-glass-sm:hover {
    background: rgba(255,255,255,0.72);
    box-shadow: 0 6px 18px -2px rgba(31,58,46,0.24), inset 0 1px 0 rgba(255,255,255,0.7);
    transform: translateY(-1px);
  }
  .btn-primary:active, .btn-glass-sm:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px -2px rgba(31,58,46,0.18), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .btn-primary:disabled, .btn-glass-sm:disabled {
    opacity: 0.5; cursor: not-allowed; transform: none;
  }
  .nav-badge {
    background: #ef4444; color: #fff; font-size: 10px; font-weight: 700;
    line-height: 1; border-radius: 9999px; padding: 3px 6px; margin-left: auto;
  }

  /* Fixed table layout, no wrap — every cell stays on one line; tables
     scroll horizontally (via the .card overflow-x-auto wrapper) instead
     of wrapping text or shrinking columns. */
  table th, table td { white-space: nowrap; }

  /* Voucher stamps */
  .voucher-stamp { pointer-events: none; user-select: none; }

  @media print {
    #sidebar, header, #sidebar-backdrop, .print\:hidden { display: none !important; }
    body { background: #fff !important; }
    main#content { padding: 0 !important; }
    #voucher-print-area { box-shadow: none !important; border: 1px solid #999 !important; }
  }
</style>

/* ==========================================================================
   HELPERS
   ========================================================================== */
function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function icon(name, cls = "w-5 h-5") {
  return `<i data-lucide="${name}" class="${cls}"></i>`;
}
function refreshIcons() { if (window.lucide) lucide.createIcons(); }
function findNavByPath(path) {
  for (const item of NAV) {
    if (item.path === path) return { item, child: null };
    if (item.children) {
      const child = item.children.find(c => c.path === path);
      if (child) return { item, child };
    }
  }
  return null;
}
function canAccess(topPath) {
  if (!currentProfile) return true;
  const perms = ROLE_PERMISSIONS[currentProfile.role] || {};
  return perms[topPath] !== false;
}
function canAccessChild(childPath) {
  if (!currentProfile) return true;
  const top = String(childPath).split('/')[0];
  const sub = (ROLE_SUBPERMISSIONS[currentProfile.role] || {})[top];
  return !sub || sub.includes(childPath);
}
// First page this role can open — where it lands after signing in, and where it is sent
// if it asks for a page (such as the Dashboard) that its role doesn't include.
function landingPath() {
  for (const item of NAV) {
    if (!canAccess(item.path)) continue;
    if (item.children && item.children.length) {
      const first = item.children.find(c => canAccessChild(c.path));
      if (first) return first.path;
      continue;
    }
    return item.path;

async function handleSignIn() {
  const email = loginNameToEmail(document.getElementById('login-email').value);
  const password = document.getElementById('login-password').value;
  const remember = document.getElementById('login-remember').checked;
  const btn = document.getElementById('login-submit');
  const btnText = document.getElementById('login-submit-text');

  if (!firebaseReady) { showLoginError('Firebase is not configured. See the firebaseConfig object near the top of this file.'); return; }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged will take over rendering
  } catch (err) {
    showLoginError(friendlyAuthError(err));
    btn.disabled = false;
    btnText.textContent = 'Sign In';
  }
}

async function handleSignUp() {
  const name = document.getElementById('login-name').value.trim();
  const loginName = normalizeLoginName(document.getElementById('login-email').value);
  const email = loginNameToEmail(loginName);
  const password = document.getElementById('login-password').value;
  const confirmPassword = document.getElementById('login-password-confirm').value;
  const btn = document.getElementById('login-submit');
  const btnText = document.getElementById('login-submit-text');

  if (!firebaseReady) { showLoginError('Firebase is not configured. See the firebaseConfig object near the top of this file.'); return; }
  if (!/^[A-Z0-9][A-Z0-9._-]{2,}$/.test(loginName)) { showLoginError('Enter a valid ID Number (letters, numbers, dash), e.g. MTISI-00007.'); return; }
  if (password !== confirmPassword) { showLoginError('Passwords do not match.'); return; }
  if (password.length < 6) { showLoginError('Password must be at least 6 characters.'); return; }

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    const isFirstUser = await isFirstAccount();
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name: name || loginName,
      loginName,
      email,
      role: isFirstUser ? 'system_admin' : 'operations',
      department: isFirstUser ? 'Administration' : 'Operations',
      isActive: true,
      createdAt: serverTimestamp(),
    });
    // onAuthStateChanged will take over rendering; ensureUserProfile will
    // find this doc already created and just use it.
  } catch (err) {
    showLoginError(friendlyAuthError(err));
    btn.disabled = false;
    btnText.textContent = 'Create Account';
  }
}

function showLoginError(msg, isSuccess = false) {
  const box = document.getElementById('login-error');
  if (!box) return;
  box.textContent = msg;
  box.classList.remove('hidden');
  if (isSuccess) {
    box.classList.remove('bg-red-50','border-red-200','text-red-700');
    box.classList.add('bg-green-50','border-green-200','text-green-700');
  }
}

function friendlyAuthError(err) {
  const code = err && err.code ? err.code : '';
  const map = {
    'auth/invalid-email': 'That ID Number looks invalid. Use letters, numbers and dashes only.',
    'auth/user-disabled': 'This account has been disabled.',
    'auth/user-not-found': 'No account found with that ID Number.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/invalid-credential': 'Incorrect ID Number or password.',
    'auth/too-many-requests': 'Too many attempts. Please wait and try again.',
    'auth/email-already-in-use': 'An account with that ID Number already exists. Try signing in instead.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Firebase rejected the API key in firebaseConfig. Double-check you copied it exactly from Project Settings > General > Your apps, with no missing characters or quotes.',
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

/* ---- Live notification bell ----
   Listens to CRM sales orders (and, for approvers, FMS vouchers / cash
   advances) so the bell and badges update by themselves, no refresh needed. */
let liveNotifUnsubs = [];
let liveNotifTimer = null;
let liveNotifPoll = null;
function scheduleLiveNotifRefresh() {
  clearTimeout(liveNotifTimer);
  liveNotifTimer = setTimeout(() => { refreshApprovalsBadge(); }, 800);
}
function stopLiveNotifications() {
  liveNotifUnsubs.forEach(u => { try { u(); } catch (_) {} });
  liveNotifUnsubs = [];
  clearTimeout(liveNotifTimer);
  clearInterval(liveNotifPoll); liveNotifPoll = null;
}
function startLiveNotifications() {
  stopLiveNotifications();
  const watch = (database, name) => {
    try {
      liveNotifUnsubs.push(onSnapshot(collection(database, name), scheduleLiveNotifRefresh, (e) => console.warn('Live ' + name + ' listener:', e.code || e)));
    } catch (e) { console.error(e); }
  };
  if (crmReady && crmDb) watch(crmDb, 'salesorders');
  if (db && canApproveDisbursements()) { watch(db, 'disbursementVouchers'); watch(db, 'cashAdvances'); }
  // Safety net in case a listener drops (overdue advances also change by date, not by edits).
  liveNotifPoll = setInterval(() => { if (currentUser) refreshApprovalsBadge(); }, 5 * 60 * 1000);
}

    ${recentSalesOrders.length ? recentSalesOrders.slice(0, 8).map(so => `
      <a href="#/client-orders/new-po" data-so-open="${so.id}" class="block px-3 py-2 hover:bg-cream border-b border-borderc">
        <p class="text-sm text-charcoal">${escapeAttr(so.controlNo || so.orderNo || 'Sales Order')} — ${escapeAttr((so.billedTo && so.billedTo.name) || 'Unknown Client')}</p>
        <p class="text-xs text-muted">${so.total != null ? formatCurrency(so.total) + ' · ' : ''}Click to auto-fill a new Client PO</p>
      </a>`).join('') : `<p class="px-3 py-3 text-xs text-muted border-b border-borderc">No new sales orders.</p>`}
    <a href="#/notifications" class="block px-3 py-2.5 text-center text-xs font-medium text-forest hover:bg-cream">View notification history</a>` : '';
  if (!approvalsSection && !liquidationSection && !overdueSection && !crmSection) return `<p class="px-3 py-4 text-xs text-muted text-center">No notifications.</p>`;
  return approvalsSection + liquidationSection + overdueSection + crmSection;
}
async function refreshNotificationBell() {
  const badgeEl = document.getElementById('notif-badge');
  const bodyEl = document.getElementById('notif-panel-body');
  if (!badgeEl) return;
  let pendingDVs = [];
  let overdueAdvances = [];
  let liquidationReviews = [];
  if (canApproveDisbursements()) {
    try {
      const vouchers = await fetchFinanceCollection('disbursementVouchers');
      pendingDVs = vouchers.filter(v => v.status === 'Pending');
    } catch (e) { console.error(e); }
    try {
      const advances = await fetchFinanceCollection('cashAdvances');
      overdueAdvances = advances.filter(isCAOverdue);
      liquidationReviews = advances.filter(a => a.status === 'Pending Liquidation Review');
    } catch (e) { console.error(e); }
  }
  let recentSalesOrders = [];
  if (crmReady) {
    try {
      if (canAccess('client-orders')) {
        const all = await fetchRecentCRMSalesOrders(100);
        const cutoff = Date.now() - SO_NEW_WINDOW_MS;
        recentSalesOrders = all.filter(so => !isSalesOrderRead(so.id) && salesOrderTimestampMs(so) >= cutoff);
      }
    } catch (e) { console.error(e); }
  }
  notificationCache = { pendingDVs, recentSalesOrders, overdueAdvances, liquidationReviews };
  const newSalesOrderCount = recentSalesOrders.length;
  const total = pendingDVs.length + liquidationReviews.length + overdueAdvances.length + newSalesOrderCount;
  badgeEl.innerHTML = total > 0 ? `<span class="nav-badge" style="position:absolute;top:2px;right:2px;">${total}</span>` : '';
  if (bodyEl) { bodyEl.innerHTML = notificationPanelBodyHtml(); refreshIcons(); }
}

function applyUserToChrome() {
  const name = (currentProfile && currentProfile.name) || (currentUser && currentUser.email) || 'User';
  const role = currentProfile ? roleLabel(currentProfile.role) : '—';
  const initials = name.split(' ').map(p => p[0]).filter(Boolean).slice(0,2).join('').toUpperCase() || '?';
  ['sidebar-username','header-username'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = name; });
  ['sidebar-userrole','header-userrole'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = role; });
  ['sidebar-avatar','header-avatar'].forEach(id => { const n = document.getElementById(id); if (n) n.textContent = initials; });
}

const TEAM_ROLES = ['system_admin', 'finance_manager', 'custodian', 'procurement_staff', 'operations'];
function roleLabel(role) {
  const map = {
    system_admin: 'System Admin', finance_manager: 'Finance Manager', custodian: 'Custodian',
    procurement_staff: 'Procurement Staff', operations: 'Operations',
    // Legacy
    super_admin: 'System Admin (legacy)', admin: 'System Admin (legacy)',
    management: 'Finance Manager (legacy)', finance_staff: 'Operations (legacy)',
  };

function wireShellEvents() {
  document.getElementById('sidebar-toggle')?.addEventListener('click', () => toggleSidebar(true));
  document.getElementById('sidebar-backdrop')?.addEventListener('click', () => toggleSidebar(false));

  document.getElementById('sidebar-signout')?.addEventListener('click', handleSignOut);
  document.getElementById('header-signout')?.addEventListener('click', handleSignOut);

  document.getElementById('header-profile-btn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    document.getElementById('header-profile-menu')?.classList.toggle('hidden');
  });
  document.addEventListener('click', () => document.getElementById('header-profile-menu')?.classList.add('hidden'));

  document.getElementById('notif-bell-btn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const panel = document.getElementById('notif-panel');
    const willOpen = panel?.classList.contains('hidden');
    panel?.classList.toggle('hidden');
    if (willOpen) refreshNotificationBell();
  });
  document.addEventListener('click', () => document.getElementById('notif-panel')?.classList.add('hidden'));
  document.getElementById('notif-panel')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const soLink = e.target.closest('[data-so-open]');
    if (soLink) { e.preventDefault(); openSalesOrderNotification(soLink.getAttribute('data-so-open')); return; }
    if (e.target.closest('a[href]')) document.getElementById('notif-panel')?.classList.add('hidden');
  });

  document.querySelectorAll('[data-nav-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-nav-toggle');
      const item = NAV.find(n => n.path === key);
      if (item && item.children) {
        const group = document.querySelector(`.nav-group[data-nav-key="${key}"]`);
        if (group) group.classList.toggle('expanded');
      } else {
        navigateTo(key);
      }
    });
  });

  document.querySelectorAll('[data-route]').forEach(n => {
    n.addEventListener('click', (e) => {
      e.preventDefault();
      navigateTo(n.getAttribute('data-route'));
    });
  });
}

function toggleSidebar(open) {

  sb.classList.toggle('-translate-x-full', !open);

function navigateTo(path) {
  window.location.hash = `#/${path}`;
}

function currentPathFromHash() {
  const h = window.location.hash || '#/dashboard';
  return h.replace(/^#\//, '') || 'dashboard';

function buildBreadcrumb(topItem, childItem) {
  const parts = [];
  if (topItem) parts.push(topItem.name);
  if (childItem && childItem.name !== (topItem && topItem.name)) parts.push(childItem.name);
  const bc = document.getElementById('breadcrumb');
  if (bc) bc.innerHTML = parts.map((p, i) =>
    `<span class="${i === parts.length - 1 ? 'text-charcoal font-medium' : ''}">${p}</span>`
  ).join(' <span class="text-borderc">/</span> ');
}

  document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));

  // also highlight the group toggle button if this is a top-level-only item (Dashboard)

function formatCurrency(amount) {
  const n = Number(amount) || 0;
  return '₱ ' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDate(value) {
  if (!value) return '—';
  const d = typeof value === 'string' ? new Date(value + 'T00:00:00') : value;
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
}
function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function calcCommitmentDate(dateReceivedISO, leadTimeValue, leadTimeUnit) {
  if (!dateReceivedISO || !leadTimeValue) return '';
  const days = leadTimeUnit === 'weeks' ? Number(leadTimeValue) * 7 : Number(leadTimeValue);
  if (isNaN(days)) return '';
  const d = new Date(dateReceivedISO + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}
function isOverdue(po) {
  if (!po.commitmentDeliveryDate) return false;
  if (['Complete Delivery', 'Ready for Billing', 'Completed', 'Cancelled'].includes(po.status)) return false;
  return po.commitmentDeliveryDate < todayISO();
}
function escapeAttr(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

async function fetchCRMSalesOrderByControlNo(controlNo) {

function salesOrderTimestampMs(so) {
  if (so.createdAt && so.createdAt.toDate) return so.createdAt.toDate().getTime();
  if (so.createdAt) { const t = new Date(so.createdAt).getTime(); if (!isNaN(t)) return t; }
  if (so.poDate) { const t = new Date(so.poDate).getTime(); if (!isNaN(t)) return t; }
  return 0;
}
const crmSOById = {};
async function fetchRecentCRMSalesOrders(limitCount) {
  if (!crmReady) return [];
  const snap = await getDocs(collection(crmDb, 'salesorders'));
  const docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  docs.sort((a, b) => salesOrderTimestampMs(b) - salesOrderTimestampMs(a));
  docs.forEach(d => { crmSOById[d.id] = d; });
  return docs.slice(0, limitCount);
}

let crmSuppliersCache = null;
function wireCRMSupplierSearch() {
  const input = document.getElementById('crm-supplier-search');
  const resultsBox = document.getElementById('crm-supplier-results');
  const statusEl = document.getElementById('crm-supplier-status');

  input.addEventListener('input', async () => {
    const query = input.value.trim().toLowerCase();
    if (!query) { resultsBox.classList.add('hidden'); statusEl.textContent = ''; return; }

    if (!crmSuppliersCache) {
      statusEl.textContent = 'Searching CRM...';
      try {
        crmSuppliersCache = await fetchAllCRMSuppliers();
        statusEl.textContent = '';
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Could not reach CRM. Check that the CRM-v2 Firestore rule for suppliers has been updated.';
        return;
      }
    }

    const matches = crmSuppliersCache.filter(s => (s.name || '').toLowerCase().includes(query)).slice(0, 8);
    if (!matches.length) {
      resultsBox.innerHTML = `<div class="px-3 py-2 text-xs text-muted">No matching suppliers in CRM.</div>`;
      resultsBox.classList.remove('hidden');
      return;
    }
    resultsBox.innerHTML = matches.map(s => `
      <button type="button" data-crm-supplier-id="${s.id}" class="w-full text-left px-3 py-2 text-sm hover:bg-cream border-b border-borderc last:border-0">
        <span class="font-medium text-charcoal">${escapeAttr(s.name)}</span>
        ${s.contactPerson ? `<span class="text-xs text-muted"> — ${escapeAttr(s.contactPerson)}</span>` : ''}
      </button>`).join('');
    resultsBox.classList.remove('hidden');

    resultsBox.querySelectorAll('[data-crm-supplier-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const supplier = crmSuppliersCache.find(s => s.id === btn.getAttribute('data-crm-supplier-id'));
        if (supplier) fillSupplierFormFromCRM(supplier);
        resultsBox.classList.add('hidden');
        input.value = supplier ? supplier.name : '';
      });
    });
  });

  document.addEventListener('click', (e) => {
    if (!resultsBox.contains(e.target) && e.target !== input) resultsBox.classList.add('hidden');
  });
}
function fillSupplierFormFromCRM(s) {
  const setVal = (id, value) => { const el = document.getElementById('field-' + id); if (el && value != null) el.value = value; };
  setVal('name', s.name);
  setVal('contactPerson', s.contactPerson);

  const noteParts = [`Pulled from CRM supplier record${s.department ? ' (Department: ' + s.department + ')' : ''}.`];

}

/* ---- Reusable form field builders ---- */
/* ---- Standard client list for Client PO ----
   One searchable list so every PO uses the same spelling of a client:
   CRM customers (and clients on CRM sales orders), FMS-only clients added with "+ New",
   and client names already used on existing POs. */
let clientListCache = null;
const normClientName = (n) => String(n || '').replace(/\s+/g, ' ').trim();
// The department of the CRM record (e.g. "Business Development"), shown beside the client name.
function holderOf(rec) {
  if (!rec) return '';
  const v = rec.department || rec.dept;
  return typeof v === 'string' ? v.trim() : '';
}
function addToClientCache(name, source, holder) {
  const n = normClientName(name);
  if (!n || !clientListCache) return;
  const k = n.toLowerCase();
  const h = normClientName(holder);
  const cur = clientListCache.get(k);
  if (!cur) clientListCache.set(k, { name: n, source, holder: h });
  else if (!cur.holder && h) cur.holder = h;
}
async function loadClientList(force = false) {
  if (clientListCache && !force) return clientListCache;
  const map = new Map();
  clientListCache = map;
  // The single source for every Client Name dropdown: Settings > Customer List (active customers only).
  try {
    (await fetchFinanceCollection('clients')).forEach(c => { if (c.isActive !== false) addToClientCache(c.name, c.source || 'Non-CRM', c.department); });
  } catch (e) { console.warn('Customer List not readable:', e.code || e); }
  return map;
}
// Returns the standard spelling of a client, or null if it isn't on the list.
async function resolveClientName(typed, original) {
  const n = normClientName(typed);
  if (!n) return null;
  const list = await loadClientList();
  const hit = list.get(n.toLowerCase());
  if (hit) return hit.name;
  if (original && normClientName(original).toLowerCase() === n.toLowerCase()) return normClientName(original);
  return null;
}
function clientNameFieldHtml(value) {
  return `
    <div>
      <label class="block text-sm font-medium text-charcoal mb-1.5">Client Name <span class="text-red-500">*</span></label>
      <div class="flex gap-2">
        <input id="field-clientName" type="text" required list="client-name-list" autocomplete="off" value="${escapeAttr(value)}" placeholder="Select or type to search"
          class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest" />
        <button type="button" id="add-client-btn" class="btn-glass-sm shrink-0">+ New</button>
      </div>
      <datalist id="client-name-list"></datalist>
      <p class="text-xs text-muted mt-1.5">Pick from the list so names stay consistent. Not listed? Click + New (or see Settings &gt; Customer List).</p>
    </div>`;
}
function wireClientNameField() {
  const input = document.getElementById('field-clientName');
  if (!input) return;
  const fillList = (map) => {
    const dl = document.getElementById('client-name-list');
    if (!dl) return;
    dl.innerHTML = [...map.values()].sort((a, b) => a.name.localeCompare(b.name))
      .map(c => `<option value="${escapeAttr(c.name)}"></option>`).join('');
  };
  loadClientList().then(fillList);
  // snap to the standard spelling when the user leaves the box
  input.addEventListener('blur', async () => {
    const hit = (await loadClientList()).get(normClientName(input.value).toLowerCase());
    if (hit) input.value = hit.name;
  });
  document.getElementById('add-client-btn')?.addEventListener('click', () => openAddClientModal(input, fillList));
}
function openAddClientModal(input, fillList) {
  document.getElementById('add-client-modal')?.remove();
  document.body.insertAdjacentHTML('beforeend', `
    <div id="add-client-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4">
      <div class="w-full max-w-sm bg-white rounded-xl shadow-card border border-borderc p-6">
        <h2 class="text-base font-semibold text-charcoal mb-1">Add Non-CRM Client</h2>
        <p class="text-xs text-muted mb-3">Use the client's full registered name. It will appear in the list for everyone.</p>
        <div id="add-client-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2 mb-3"></div>
        <input id="add-client-name" type="text" class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest" placeholder="Company Name, e.g. ABC Philippines Inc." />
        <input id="add-client-holder" type="text" class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm mt-3 focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest" placeholder="Department, e.g. Business Development" />
        <div class="flex justify-end gap-2 pt-4">
          <button type="button" id="add-client-cancel" class="rounded-md border border-borderc px-4 py-2 text-sm text-charcoal hover:bg-cream">Cancel</button>
          <button type="button" id="add-client-save" class="rounded-md bg-forest px-4 py-2 text-sm font-medium text-white hover:bg-forest-dark disabled:opacity-60">Add Client</button>
        </div>
      </div>
    </div>`);
  const close = () => document.getElementById('add-client-modal')?.remove();
  document.getElementById('add-client-cancel').addEventListener('click', close);
  document.getElementById('add-client-name').focus();
  document.getElementById('add-client-save').addEventListener('click', async () => {
    const name = normClientName(document.getElementById('add-client-name').value);
    const err = document.getElementById('add-client-error');
    if (!name) { err.textContent = 'Enter the client name.'; err.classList.remove('hidden'); return; }
    const list = await loadClientList();
    const existing = list.get(name.toLowerCase());
    if (existing) { input.value = existing.name; close(); return; } // already listed: just select it
    const btn = document.getElementById('add-client-save');
    btn.disabled = true;
    try {
      const holder = normClientName(document.getElementById('add-client-holder').value);
      await createFinanceDoc('clients', { name, department: holder, source: 'Non-CRM', isActive: true });
      addToClientCache(name, 'Non-CRM', holder);
      fillList(await loadClientList());
      input.value = name;
      close();
    } catch (e) {
      console.error(e);
      err.textContent = 'Could not save the client. Please try again.';
      err.classList.remove('hidden');
      btn.disabled = false;
    }
  });
}

function wirePOFormAutoCalc() {
  const recalc = () => {
    const dateReceived = document.getElementById('field-dateReceived')?.value;
    const leadTimeValue = document.getElementById('field-leadTimeValue')?.value;
    const leadTimeUnit = document.getElementById('field-leadTimeUnit')?.value;
    const commitField = document.getElementById('field-commitmentDeliveryDate');
    if (commitField && dateReceived && leadTimeValue) {
      commitField.value = calcCommitmentDate(dateReceived, leadTimeValue, leadTimeUnit);
    }
  };
  ['field-dateReceived', 'field-leadTimeValue', 'field-leadTimeUnit'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', recalc);
  });
}
function paymentTermsSummary(type, advanceAmount, days, customDays) {
  if (type === 'Advance Payment') {
    return `Advance Payment${advanceAmount ? ' — ' + formatCurrency(advanceAmount) : ''}`;
  }
  if (type === 'COD') return 'COD';
  if (type === 'Terms') {
    const daysLabel = days === 'Custom' ? (customDays ? `Custom — ${customDays} days` : 'Custom') : days;
    return daysLabel ? `Terms — ${daysLabel}` : 'Terms';
  }
  return '';
}
function readPOFormValues() {
  const val = (id) => { const el = document.getElementById('field-' + id); return el ? el.value.trim() : ''; };
  const paymentTermsType = val('paymentTermsType');
  const advancePaymentAmount = val('advancePaymentAmount') ? Number(val('advancePaymentAmount')) : null;
  const paymentTermsDays = val('paymentTermsDays');
  const customPaymentDays = val('customPaymentDays') ? Number(val('customPaymentDays')) : null;
  return {
    clientName: val('clientName'),
    clientPONumber: val('clientPONumber'),
    poType: val('poType'),
    priority: val('priority') || 'Normal',
    projectDescription: val('projectDescription'),
    poAmount: Number(val('poAmount')) || 0,
    dateReceived: val('dateReceived'),
    poDateForwarded: val('poDateForwarded'),
    leadTimeValue: val('leadTimeValue') ? Number(val('leadTimeValue')) : null,
    leadTimeUnit: val('leadTimeUnit') || 'days',
    commitmentDeliveryDate: val('commitmentDeliveryDate'),
    clientContactPerson: val('clientContactPerson'),
    clientContactNumber: val('clientContactNumber'),
    salesPerson: val('salesPerson'),
    salesInvoiceNo: val('salesInvoiceNo'),
    crmControlNumber: val('crmControlNumber'),
    crmSalesOrderNumber: val('crmSalesOrderNumber'),
    deliveryReceiptNo: val('deliveryReceiptNo'),
    collectionReceiptNo: val('collectionReceiptNo'),
    paymentTermsType,
    advancePaymentAmount,
    paymentTermsDays,
    customPaymentDays,
    paymentTerms: paymentTermsSummary(paymentTermsType, advancePaymentAmount, paymentTermsDays, customPaymentDays),
    warranty: val('warranty'),
    poDocumentReference: val('poDocumentReference'),
    notes: val('notes'),
  };
}

function wirePaymentTermsField() {
  const typeSel = document.getElementById('field-paymentTermsType');
  if (!typeSel) return;
  const daysSel = document.getElementById('field-paymentTermsDays');
  const syncType = () => {
    document.getElementById('pt-advance-wrap').classList.toggle('hidden', typeSel.value !== 'Advance Payment');
    document.getElementById('pt-days-wrap').classList.toggle('hidden', typeSel.value !== 'Terms');
  };
  const syncDays = () => {
    document.getElementById('pt-custom-wrap').classList.toggle('hidden', !daysSel || daysSel.value !== 'Custom');
  };
  typeSel.addEventListener('change', syncType);
  if (daysSel) daysSel.addEventListener('change', syncDays);
}

function wireQuickStatusSelects(onChangeReload) {
  document.querySelectorAll('[data-quick-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const id = sel.getAttribute('data-quick-status');
      const newStatus = sel.value;
      sel.disabled = true;
      try {
        await updateClientPO(id, { status: newStatus });
        await onChangeReload();
      } catch (e) {
        console.error(e);
        alert('Could not update status. Please try again.');
        sel.disabled = false;
      }
    });
  });
}

function wireCRMPullButton() {
  const btn = document.getElementById('crm-pull-btn');
  const btnText = document.getElementById('crm-pull-btn-text');
  const resultBox = document.getElementById('crm-pull-result');
  let lastMatch = null;

  btn.addEventListener('click', async () => {
    const controlNo = document.getElementById('crm-pull-input').value.trim();
    resultBox.innerHTML = '';
    lastMatch = null;
    if (!controlNo) {
      resultBox.innerHTML = `<p class="text-xs text-red-600">Enter a Control No. first.</p>`;
      return;
    }
    btn.disabled = true;
    btnText.innerHTML = spinnerHtml();
    try {
      const so = await fetchCRMSalesOrderByControlNo(controlNo);
      if (!so) {
        resultBox.innerHTML = `<p class="text-xs text-red-600">No Sales Order found with that Control No.</p>`;
      } else {
        lastMatch = so;
        resultBox.innerHTML = crmPullResultHtml(so);
        refreshIcons();
        document.getElementById('crm-pull-confirm').addEventListener('click', () => {
          fillPOFormFromCRM(lastMatch);
        });
      }
    } catch (e) {
      console.error(e);
      resultBox.innerHTML = `<p class="text-xs text-red-600">Could not reach CRM. Check that the CRM-v2 Firestore rule for salesorders has been updated, and that the Control No. is correct.</p>`;
    }
    btn.disabled = false;
    btnText.textContent = 'Search CRM';
  });
}

function fillPOFormFromCRM(so) {
  poPulledFromCRM = true;
  const setVal = (id, value) => { const el = document.getElementById('field-' + id); if (el && value != null) el.value = value; };

  if (so.billedTo && so.billedTo.name) { addToClientCache(so.billedTo.name, 'CRM Sales Order', holderOf(so)); ensureCustomerExists(so.billedTo.name, 'CRM Sales Order', holderOf(so)); }
  setVal('clientName', so.billedTo && so.billedTo.name && normClientName(so.billedTo.name));
  setVal('clientPONumber', so.poNumber);
  setVal('dateReceived', so.poDate);
  // CRM builds a sales order as orderNo = "SO-" + the quotation's own number (quoteNo), and its
  // controlNo is a separate control number. The quotation number is what goes in this field.
  const quoteNo = (typeof so.quoteNo === 'string' && so.quoteNo.trim()) || String(so.orderNo || '').replace(/^SO-/i, '').trim();
  setVal('crmControlNumber', quoteNo);
  setVal('crmSalesOrderNumber', so.orderNo || '');
  setVal('clientContactPerson', so.billedTo && so.billedTo.contactName);
  setVal('clientContactNumber', so.billedTo && so.billedTo.phone);
  setVal('poAmount', so.total);

  // CRM's Sales Order only stores the "Terms" side of payment terms
  // (paymentTermsDays / paymentTermsCustomDays) — no equivalent for
  // Advance Payment or COD yet, so this only fires when CRM has a Net X
  // value set. Field values are set first, then 'change' is dispatched on
  // each select so the New Client PO form's own show/hide logic reveals
  // the right sub-fields, exactly as if picked by hand.
  if (so.paymentTermsDays) {
    setVal('paymentTermsType', 'Terms');
    document.getElementById('field-paymentTermsType')?.dispatchEvent(new Event('change'));
    setVal('paymentTermsDays', so.paymentTermsDays);
    document.getElementById('field-paymentTermsDays')?.dispatchEvent(new Event('change'));
    if (so.paymentTermsCustomDays != null) setVal('customPaymentDays', so.paymentTermsCustomDays);
  }

  if (Array.isArray(so.items) && so.items.length) {
    const descriptions = so.items.map(i => i.desc).filter(Boolean).join('; ');
    setVal('projectDescription', descriptions);
  }

  const noteParts = [`Pulled from CRM Sales Order ${so.orderNo || ''} (Control No. ${so.controlNo || ''}).`];
  if (so.notes) noteParts.push(so.notes);
  setVal('notes', noteParts.join(' '));

  // Recalculate commitment date if a lead time is already set
  const recalcEvent = new Event('change');
  document.getElementById('field-dateReceived')?.dispatchEvent(recalcEvent);
}

async function handleCreatePOSubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('po-form-submit');
  const btnText = document.getElementById('po-form-submit-text');
  const errBox = document.getElementById('po-form-error');
  errBox.classList.add('hidden');

  const data = readPOFormValues();
  if (!data.clientName || !data.clientPONumber || !data.poType || !data.poAmount || !data.dateReceived) {
    errBox.textContent = 'Please fill in all required fields (marked with *).';
    errBox.classList.remove('hidden');
    return;
  }
  const stdClient = await resolveClientName(data.clientName, '');
  if (!stdClient) {
    errBox.textContent = 'Please pick the Client Name from the list. If the client is not listed, click + New to add it.';
    errBox.classList.remove('hidden');
    return;
  }
  data.clientName = stdClient;

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    data.status = 'Open';
    data.source = poPulledFromCRM ? 'CRM' : 'Manual';
    await createClientPO(data);
    navigateTo('client-orders/open-pos');
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not save this PO. Please check your connection and try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Save Client PO';
  }
}

  try {

    const openCount = all.filter(p => PO_OPEN_STATUSES.includes(p.status)).length;
    const inDeliveryCount = all.filter(p => PO_DELIVERY_STATUSES.includes(p.status)).length;
    const readyCount = all.filter(p => p.status === 'Ready for Billing').length;
    const overdueCount = all.filter(isOverdue).length;
    const openValue = all.filter(p => !['Ready for Billing', 'Completed', 'Cancelled'].includes(p.status)).reduce((sum, p) => sum + (Number(p.poAmount) || 0), 0);

    const ytdYear = String(new Date().getFullYear());
    const ytd = all.filter(p => String(p.dateReceived || '').startsWith(ytdYear) && p.status !== 'Cancelled');
    const ytdCompleted = ytd.filter(p => p.status === 'Completed');
    const ytdValue = ytd.reduce((sum, p) => sum + (Number(p.poAmount) || 0), 0);
    const cards = [
      { label: 'Open POs', value: openCount, icon: 'inbox' },
      { label: 'In Delivery / Preparing', value: inDeliveryCount, icon: 'truck' },
      { label: 'Ready for Billing', value: readyCount, icon: 'check-circle' },
      { label: 'Overdue', value: overdueCount, icon: 'alert-triangle', tone: overdueCount > 0 ? 'text-red-600' : 'text-forest' },
      { label: 'Total Open Value', value: formatCurrency(openValue), icon: 'wallet', wide: true },
      { label: `YTD Total POs (${ytdYear})`, value: formatCurrency(ytdValue), icon: 'file-text', wide: true,

    ];

    document.getElementById('po-kpi-container').innerHTML = cards.map(c => `
      <div class="card p-5 ${c.wide ? 'sm:col-span-2' : ''}">
        <div class="flex items-start justify-between">
          <p class="text-xs font-medium text-muted uppercase tracking-wide">${c.label}</p>
          <div class="w-8 h-8 rounded-md bg-cream flex items-center justify-center ${c.tone || 'text-forest'}">${icon(c.icon, 'w-4 h-4')}</div>

        ${c.sub ? `<p class="text-xs text-muted mt-1">${c.sub}</p>` : ''}
      </div>`).join('');

    const recentSorted = [...all].sort((a, b) => {
      const at = a.updatedAt && a.updatedAt.toMillis ? a.updatedAt.toMillis() : 0;
      const bt = b.updatedAt && b.updatedAt.toMillis ? b.updatedAt.toMillis() : 0;
      return bt - at;
    });
    const MAX_SHOWN = 200;
    const drawList = () => {
      const st = document.getElementById('pm-status').value;
      const q = document.getElementById('pm-search').value.trim().toLowerCase();
      const matches = recentSorted.filter(p => (!st || p.status === st)
        && (!q || [p.clientName, p.clientPONumber, p.projectDescription].some(v => String(v || '').toLowerCase().includes(q))));
      const shown = matches.slice(0, MAX_SHOWN);
      document.getElementById('pm-count').textContent = `${matches.length} of ${all.length} PO${all.length === 1 ? '' : 's'}`
        + (matches.length > MAX_SHOWN ? ` (showing the latest ${MAX_SHOWN})` : '');
      document.getElementById('po-activity-container').innerHTML = poTableHtml(shown, { emptyMessage: st || q ? 'No POs match this filter.' : 'No POs yet.' });
      refreshIcons();
    };
    document.getElementById('pm-status').addEventListener('change', drawList);
    document.getElementById('pm-search').addEventListener('input', drawList);
    drawList();
  } catch (e) {
    console.error(e);
    document.getElementById('po-kpi-container').innerHTML = poLoadErrorHtml();
    document.getElementById('po-activity-container').innerHTML = '';
  }
}

async function handleUpdatePOSubmit(e, id) {
  e.preventDefault();
  const btn = document.getElementById('po-form-submit');
  const btnText = document.getElementById('po-form-submit-text');
  const errBox = document.getElementById('po-form-error');
  errBox.classList.add('hidden');

  const data = readPOFormValues();
  data.status = document.getElementById('field-status').value;
  data.datesDelivered = document.getElementById('field-datesDelivered').value.trim();
  data.deliveryNotes = document.getElementById('field-deliveryNotes').value.trim();
  data.partialDeliveryDetails = document.getElementById('field-partialDeliveryDetails').value.trim();

  if (!data.clientName || !data.clientPONumber || !data.poType || !data.poAmount || !data.dateReceived) {
    errBox.textContent = 'Please fill in all required fields (marked with *).';
    errBox.classList.remove('hidden');
    return;
  }
  const stdClient = await resolveClientName(data.clientName, window.__poOriginalClient || '');
  if (!stdClient) {
    errBox.textContent = 'Please pick the Client Name from the list. If the client is not listed, click + New to add it.';
    errBox.classList.remove('hidden');
    return;
  }
  data.clientName = stdClient;

  btn.disabled = true;
  btnText.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>`;

  try {
    await updateClientPO(id, data);
    const dest = PO_OPEN_STATUSES.includes(data.status) ? 'client-orders/open-pos'
      : PO_DELIVERY_STATUSES.includes(data.status) ? 'client-orders/delivery-service'
      : data.status === 'Ready for Billing' ? 'client-orders/ready-for-billing'
      : 'client-orders/po-reports';
    navigateTo(dest);
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not save changes. Please check your connection and try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'Save Changes';
  }
}

// Titles the first version of this system shipped with, and the standard account each one became.
// Used to carry old accounts over, and to line old ledger entries up with the new titles.
const LEGACY_ACCOUNT_RENAMES = {
  'Cash': 'Cash on Hand',
  'Sales Revenue': 'Sales – Materials / Products',
  'Utilities Expense': 'Utilities',
  'Rent Expense': 'Rent / Lease Expense',
  'Salaries Expense': 'Salaries & Wages',

  "Owner's Drawings": 'Owner’s Drawings',
};
// The system posts to each bank account and cash fund under its own name, so these two chart accounts
// are for reference and journal entries only — never offered as a place to charge an advance or an offset.
const CASH_LIKE_ACCOUNTS = ['Cash on Hand', 'Bank – Operating Account'];
const EXPENSE_ACCOUNT_TYPES = ['Expense', 'COGS', 'Other Expense'];
const ACCOUNTS_CHART = STANDARD_COA.map(a => a.name);
const ACCOUNT_CODE_BY_NAME = Object.fromEntries(STANDARD_COA.map(a => [a.name, a.code]));   // refreshed from the saved chart
const ACCOUNT_TYPE_BY_NAME = Object.fromEntries(STANDARD_COA.map(a => [a.name, a.type]));
function canonicalAccountName(name) { return LEGACY_ACCOUNT_RENAMES[name] || name; }
function accountLabel(name) {
  const n = canonicalAccountName(name);
  const c = ACCOUNT_CODE_BY_NAME[n];
  return c ? `${c} — ${n}` : name;
}
const EXPENSE_ACCOUNTS = STANDARD_COA.filter(a => EXPENSE_ACCOUNT_TYPES.includes(a.type)).map(a => a.name);
const CASH_OFFSET_ACCOUNTS = ACCOUNTS_CHART.filter(a => !CASH_LIKE_ACCOUNTS.includes(a));
const TAX_TYPES = ['VAT', 'Withholding Tax', 'Percentage Tax'];
const PAYMENT_METHODS = ['Cash', 'Bank Transfer', 'Check', 'Online Payment', 'Other'];
const MODE_OF_PAYMENT_OPTIONS = ['Cheque', 'Debit Memo', 'Online Banking', 'Others'];
function modeOfPaymentFieldHtml(selectedMode) {
  const current = selectedMode || MODE_OF_PAYMENT_OPTIONS[0];
  const options = MODE_OF_PAYMENT_OPTIONS.includes(current) ? MODE_OF_PAYMENT_OPTIONS : [current, ...MODE_OF_PAYMENT_OPTIONS];

    <div>
      <label class="block text-sm font-medium text-charcoal mb-1.5">Mode of Payment <span class="text-red-500">*</span></label>

        ${options.map(o => `<option value="${o}" ${current === o ? 'selected' : ''}>${o}</option>`).join('')}
      </select>

    <div id="mop-cheque-wrap" class="${current === 'Cheque' ? '' : 'hidden'}">

      </div>
    </div>`;
}
// Mode of Payment decides which accounts can be used:
//   Cash                          -> Cash-type funds only
//   Cheque / Debit Memo / Others  -> bank accounts only (anything that isn't a Cash fund)
function accountsForMode(accounts, mode) {
  return mode === 'Cash'
    ? accounts.filter(b => b.accountType === 'Cash')
    : accounts.filter(b => b.accountType !== 'Cash');
}
// Keeps the Bank Account dropdown in step with the Mode of Payment field: only matching
// accounts are listed, and a selection that no longer fits is cleared.
function wireModeBankFilter(accounts) {
  const modeSel = document.getElementById('field-modeOfPayment');
  const bankSel = document.getElementById('field-bankAccountId');
  if (!modeSel || !bankSel) return;
  const render = (keepId) => {
    const mode = modeSel.value;
    const list = accountsForMode(accounts, mode);
    bankSel.innerHTML = '<option value="">Select...</option>' + list.map(b =>
      `<option value="${b.id}" ${b.id === keepId ? 'selected' : ''}>${escapeAttr(b.nickname)}${b.bankName ? ' — ' + escapeAttr(b.bankName) : ''}</option>`).join('');
    let hint = bankSel.parentElement.querySelector('.bank-mode-hint');
    if (!hint) {
      hint = document.createElement('p');
      bankSel.parentElement.appendChild(hint);
    }
    let text, tone = 'text-muted';
    if (list.length) {
      text = mode === 'Cash' ? 'Showing Cash funds only.' : 'Showing bank accounts only.';
    } else if (mode === 'Cash') {
      text = canAccess('cash-management')
        ? 'No Cash fund available. Add a Cash-type account under Cash Management → Bank Accounts.'
        : 'No Cash fund available. Ask a System Admin or Finance Manager to add one.';
      tone = 'text-amber-700';
    } else {
      text = 'No bank account available. Add a Checking or Savings account under Cash Management → Bank Accounts.';
      tone = 'text-amber-700';
    }
    hint.className = `bank-mode-hint text-xs mt-1.5 ${tone}`;
    hint.textContent = text;
  };
  render(bankSel.value);
  modeSel.addEventListener('change', () => render(bankSel.value));
}
// Shown on a Cash Advance voucher until the approver chooses how it is paid and from which account.
function fundingPlaceholderHtml() { return '<span class="font-normal text-muted">Assigned at approval</span>'; }
// Cheque No. cell for voucher previews and the voucher itself. Until the approver enters it
// at approval, a Cheque voucher shows that it is still to be assigned.
function chequeNoCellHtml(d) {
  if (d.modeOfPayment !== 'Cheque') return '';
  const value = d.chequeNo ? escapeAttr(d.chequeNo) : '<span class="font-normal text-muted">Assigned at approval</span>';
  return `<div><p class="text-xs text-muted uppercase">Cheque No.</p><p class="font-medium text-charcoal mt-0.5">${value}</p></div>`;
}
function wireModeOfPaymentToggle(accounts) {
  const sel = document.getElementById('field-modeOfPayment');

        const amount = Number(btn.getAttribute('data-amount')) || 0;
        const clientName = btn.getAttribute('data-client');
        const clientPONumber = btn.getAttribute('data-pono');
        try {
          const dateRecognized = todayISO();
          const srRef = await createFinanceDoc('salesRecognitions', { poId, clientPONumber, clientName, amount, dateRecognized, recognizedBy: currentUser ? currentUser.email : null });
          await createFinanceDoc('accountsReceivable', {
            source: 'sales-recognition', poId, salesRecognitionId: srRef.id,
            clientPONumber, clientName, description: `Sales Recognition — ${clientPONumber}`,

async function renderARPaymentPage(id) {
  contentWrap(`<div class="text-sm text-muted">Loading...</div>`);
  let ar, bankAccounts = [];
  try {
    [ar, bankAccounts] = await Promise.all([fetchFinanceDoc('accountsReceivable', id), fetchActiveBankAccounts()]);
  } catch (e) {
    console.error(e);
    contentWrap(poLoadErrorHtml());
    return;
  }
  if (!ar) {
    contentWrap(`<div class="card flex flex-col items-center justify-center text-center py-16 px-6"><p class="text-sm text-charcoal font-medium">Entry not found.</p><a href="#/finance/accounts-receivable" class="mt-4 text-sm text-forest hover:underline">Back to Accounts Receivable</a></div>`);
    return;
  }

  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">Record Payment</h1>
      <p class="text-sm text-muted mt-1">${escapeAttr(ar.clientName)} — ${escapeAttr(ar.clientPONumber || ar.description)}</p>
    </div>
    <div class="card p-6 max-w-2xl mb-6">
      <div class="grid grid-cols-3 gap-4 text-sm">
        <div><p class="text-xs text-muted uppercase">Total Amount</p><p class="font-semibold text-charcoal mt-1">${formatCurrency(ar.amount)}</p></div>
        <div><p class="text-xs text-muted uppercase">Paid So Far</p><p class="font-semibold text-charcoal mt-1">${formatCurrency(ar.amountPaid)}</p></div>
        <div><p class="text-xs text-muted uppercase">Balance</p><p class="font-semibold text-forest mt-1">${formatCurrency(ar.balance)}</p></div>
      </div>
    </div>
    <form id="pay-form" class="card p-6 space-y-4 max-w-2xl">
      <div id="pay-form-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        ${numberField('payAmount', 'Payment Amount (₱)', { required: true, step: '0.01', value: ar.balance })}
        ${dateField('payDate', 'Payment Date', { required: true, value: todayISO() })}
        ${selectField('payMethod', 'Payment Method', PAYMENT_METHODS, { required: true, value: 'Cash' })}
        ${bankAccounts.length ? bankAccountSelectHtml(bankAccounts, null, { required: true }) : ''}
        ${textField('payNotes', 'Notes / Reference')}
      </div>
      <div class="flex items-center gap-3 pt-2 border-t border-borderc">
        <button id="pay-form-submit" type="submit" class="btn-primary"><span id="pay-form-submit-text">Record Payment</span></button>
        <a href="#/finance/accounts-receivable" class="text-sm text-muted hover:text-charcoal">Cancel</a>
      </div>
    </form>`);
  refreshIcons();

  document.getElementById('pay-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('pay-form-submit');
    const btnText = document.getElementById('pay-form-submit-text');
    const errBox = document.getElementById('pay-form-error');
    errBox.classList.add('hidden');
    const payAmount = Number(document.getElementById('field-payAmount').value) || 0;
    const payDate = document.getElementById('field-payDate').value;
    const payMethod = document.getElementById('field-payMethod').value;
    const payNotes = document.getElementById('field-payNotes').value.trim();
    const bankSel = document.getElementById('field-bankAccountId');
    const bankAccountId = bankSel ? bankSel.value : '';
    const bankAccountName = bankSel && bankAccountId ? bankSel.options[bankSel.selectedIndex].text : '';

    if (!payAmount || payAmount <= 0 || !payDate) {
      errBox.textContent = 'Enter a valid payment amount and date.';
      errBox.classList.remove('hidden');
      return;
    }
    if (bankAccounts.length && !bankAccountId) {
      errBox.textContent = 'Select which bank account received this payment.';
      errBox.classList.remove('hidden');
      return;
    }
    if (payAmount > ar.balance + 0.01) {
      errBox.textContent = `Payment cannot exceed the outstanding balance of ${formatCurrency(ar.balance)}.`;
      errBox.classList.remove('hidden');
      return;
    }

    btn.disabled = true; btnText.innerHTML = spinnerHtml();
    try {
      const newAmountPaid = Number((ar.amountPaid + payAmount).toFixed(2));
      const newBalance = Number((ar.amount - newAmountPaid).toFixed(2));
      const newStatus = newBalance <= 0.01 ? 'Paid' : (newAmountPaid > 0 ? 'Partially Paid' : 'Unpaid');
      const payments = Array.isArray(ar.payments) ? [...ar.payments] : [];
      payments.push({ date: payDate, amount: payAmount, method: payMethod, notes: payNotes, bankAccountId, bankAccountName, recordedBy: currentUser ? currentUser.email : null });

      await updateFinanceDoc('accountsReceivable', id, { amountPaid: newAmountPaid, balance: newBalance, status: newStatus, payments });
      const cashAccountName = bankAccountName || 'Cash on Hand';
      await postGLEntries([
        { date: payDate, account: cashAccountName, debit: payAmount, credit: 0, description: `Payment received — ${ar.clientName}${ar.clientPONumber ? ' (' + ar.clientPONumber + ')' : ''}`, sourceType: 'ar-payment', sourceId: id, bankAccountId: bankAccountId || null },
        { date: payDate, account: 'Accounts Receivable', debit: 0, credit: payAmount, description: `Payment received — ${ar.clientName}${ar.clientPONumber ? ' (' + ar.clientPONumber + ')' : ''}`, sourceType: 'ar-payment', sourceId: id },
      ]);
      // Issue the Official Receipt. If this step fails the payment stays recorded, and the receipt can
      // be issued later from Billing & Collection → Official Receipts.
      let orId = null;
      try {
        const lastPayment = payments[payments.length - 1];
        const or = await createOfficialReceipt({ ...ar, id }, id, lastPayment, newBalance);
        payments[payments.length - 1] = { ...lastPayment, orId: or.id, orNumber: or.number };
        await updateFinanceDoc('accountsReceivable', id, { payments });
        orId = or.id;
      } catch (orErr) { console.error(orErr); }
      navigateTo(orId && canAccess('billing') ? 'billing/official-receipts/view/' + orId : 'finance/accounts-receivable');
    } catch (err) {
      console.error(err);
      errBox.textContent = 'Could not record this payment. Please try again.';
      errBox.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Record Payment';
    }
  });
}

async function handleJournalEntrySubmit(e) {
  e.preventDefault();
  const btn = document.getElementById('je-form-submit');
  const btnText = document.getElementById('je-form-submit-text');
  const errBox = document.getElementById('je-form-error');
  errBox.classList.add('hidden');

  const date = document.getElementById('field-je-date').value;
  const reference = document.getElementById('field-je-reference').value.trim();
  const lines = [];
  document.querySelectorAll('#je-lines [data-je-row]').forEach(row => {
    const account = row.querySelector('.je-account').value;
    const debit = Number(row.querySelector('.je-debit').value) || 0;
    const credit = Number(row.querySelector('.je-credit').value) || 0;
    if (account && (debit || credit)) lines.push({ account, debit, credit });
  });

  const totalDebit = lines.reduce((s, l) => s + l.debit, 0);
  const totalCredit = lines.reduce((s, l) => s + l.credit, 0);

  if (!date || !reference) {
    errBox.textContent = 'Date and Reference/Description are required.';
    errBox.classList.remove('hidden');
    return;
  }
  if (lines.length < 2) {
    errBox.textContent = 'Add at least two lines.';
    errBox.classList.remove('hidden');
    return;
  }
  if (Math.abs(totalDebit - totalCredit) > 0.01 || totalDebit === 0) {
    errBox.textContent = `Debits (${formatCurrency(totalDebit)}) and Credits (${formatCurrency(totalCredit)}) must balance and be greater than zero.`;
    errBox.classList.remove('hidden');
    return;
  }

  btn.disabled = true; btnText.innerHTML = spinnerHtml();
  try {
    const jeRef = await createFinanceDoc('journalEntries', { date, reference, lines });
    await postGLEntries(lines.map(l => ({ date, account: l.account, debit: l.debit, credit: l.credit, description: reference, sourceType: 'journal-entry', sourceId: jeRef.id })));
    navigateTo('finance/journal-entries');
  } catch (err) {
    console.error(err);
    errBox.textContent = 'Could not post this journal entry. Please try again.';
    errBox.classList.remove('hidden');
    btn.disabled = false; btnText.textContent = 'Post Journal Entry';
  }
}

function addDocumentRow(docItem = {}) {
  const container = document.getElementById('doc-rows');

      ${docItem.link ? `<a href="${escapeAttr(docItem.link)}" target="_blank" rel="noopener noreferrer" class="text-forest hover:text-forest-dark" title="Open">${icon('external-link', 'w-4 h-4')}</a>` : `<span class="doc-open-slot"></span>`}
      <button type="button" class="doc-remove text-muted hover:text-red-600" title="Remove">${icon('x', 'w-4 h-4')}</button>
    </div>`;
  container.appendChild(row);
  refreshIcons();
  const linkInput = row.querySelector('.doc-link');
  const openSlot = row.querySelector('.doc-open-slot');
  if (openSlot) {
    linkInput.addEventListener('change', () => {
      if (linkInput.value.trim() && !row.querySelector('a')) {
        openSlot.outerHTML = `<a href="${escapeAttr(linkInput.value.trim())}" target="_blank" rel="noopener noreferrer" class="text-forest hover:text-forest-dark" title="Open">${icon('external-link', 'w-4 h-4')}</a>`;
        refreshIcons();
      }
    });
  }
  row.querySelector('.doc-remove').addEventListener('click', () => row.remove());
}
function wireSupplierDocuments(s = {}) {
  document.getElementById('doc-add-row').addEventListener('click', () => addDocumentRow());

    e.preventDefault();
    const btn = document.getElementById('pr-form-submit');
    const btnText = document.getElementById('pr-form-submit-text');
    const errBox = document.getElementById('pr-form-error');
    errBox.classList.add('hidden');
    const val = (id) => document.getElementById('field-' + id).value.trim();
    const prNumber = val('prNumber'), requestedBy = val('requestedBy'), department = val('department'),
      dateRequested = val('dateRequested'), estimatedCost = Number(val('estimatedCost')) || 0,
      priority = val('priority') || 'Normal', status = val('status'), itemsNeeded = val('itemsNeeded'), notes = val('notes');
    const supplierSel = document.getElementById('field-supplierId');
    const supplierId = supplierSel.value;
    const supplierName = supplierId ? supplierSel.options[supplierSel.selectedIndex].text : '';

    if (!prNumber || !requestedBy || !dateRequested || !estimatedCost || !itemsNeeded) {
      errBox.textContent = 'Please fill in all required fields.';
      errBox.classList.remove('hidden');
      return;
    }
    btn.disabled = true; btnText.innerHTML = spinnerHtml();
    try {
      await updateFinanceDoc('purchaseRequests', id, { prNumber, requestedBy, department, dateRequested, estimatedCost, priority, supplierId, supplierName, itemsNeeded, notes, status });
      navigateTo('procurement/purchase-requests');
    } catch (err) {
      console.error(err);
      errBox.textContent = 'Could not save changes. Please try again.';
      errBox.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Save Changes';
    }
  });
}

function spoMoney(n) {
  const v = Number(n) || 0;
  return '₱' + v.toLocaleString('en-PH', { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 });
}
// Items on a PO. Older POs only have a text description + amount, so they show as one line.
function spoItemsOf(po) {
  if (Array.isArray(po.items) && po.items.length) return po.items.map(i => ({ desc: i.desc || '', qty: Number(i.qty) || 0, price: Number(i.price) || 0 }));
  if (po.itemsDescription || po.poAmount) return [{ desc: po.itemsDescription || '', qty: 1, price: Number(po.poAmount) || 0 }];
  return [];
}
function spoTotals(items, vatPct) {
  const sub = items.reduce((sum, i) => sum + (Number(i.qty) || 0) * (Number(i.price) || 0), 0);
  const vat = sub * ((Number(vatPct) || 0) / 100);
  return { sub, vat, total: sub + vat };
}
function spoAmountFieldHtml(value) {
  return `
    <div>
      <label class="block text-sm font-medium text-charcoal mb-1.5">PO Amount (₱) <span class="text-red-500">*</span></label>
      <input id="field-poAmount" type="number" step="0.01" readonly value="${Number(value) || 0}" class="w-full rounded-md border border-borderc bg-cream/60 px-3 py-2.5 text-sm" />
      <p class="text-xs text-muted mt-1.5">Worked out from the items below, including VAT.</p>
    </div>`;
}

}
function spoItemsEditorHtml(items, vatPct) {
  const rows = items && items.length ? items : [{ desc: '', qty: 1, price: '' }];
  return `
    <div class="sm:col-span-2">
      <label class="block text-sm font-medium text-charcoal mb-1.5">Items <span class="text-red-500">*</span></label>
      <div class="card overflow-x-auto">

        <div class="flex justify-between"><span class="text-muted">VAT amount</span><span id="spo-vatamt">₱ 0.00</span></div>
        <div class="flex justify-between font-semibold border-t border-borderc pt-1.5"><span>Total</span><span id="spo-total">₱ 0.00</span></div>

function wireSPOItemsEditor() {
  const body = document.getElementById('spo-rows');
  if (!body) return;
  const recalc = () => {
    let sub = 0;
    body.querySelectorAll('.spo-row').forEach(r => {
      const amt = (Number(r.querySelector('.spo-qty').value) || 0) * (Number(r.querySelector('.spo-price').value) || 0);
      r.querySelector('.spo-amt').textContent = formatCurrency(amt);
      sub += amt;
    });
    const t = spoTotals([{ qty: 1, price: sub }], document.getElementById('spo-vat').value);
    document.getElementById('spo-subtotal').textContent = formatCurrency(t.sub);
    document.getElementById('spo-vatamt').textContent = formatCurrency(t.vat);
    document.getElementById('spo-total').textContent = formatCurrency(t.total);
    const amountField = document.getElementById('field-poAmount');
    if (amountField) amountField.value = t.total.toFixed(2);
  };
  body.addEventListener('input', recalc);
  document.getElementById('spo-vat').addEventListener('input', recalc);
  body.addEventListener('click', (e) => {
    if (!e.target.closest('.spo-del')) return;
    const rows = body.querySelectorAll('.spo-row');
    if (rows.length > 1) e.target.closest('.spo-row').remove();
    else { rows[0].querySelector('.spo-desc').value = ''; rows[0].querySelector('.spo-qty').value = 1; rows[0].querySelector('.spo-price').value = ''; }
    recalc();
  });
  document.getElementById('spo-add').addEventListener('click', () => {
    body.insertAdjacentHTML('beforeend', spoItemRowHtml({ desc: '', qty: 1, price: '' }));
    body.lastElementChild.querySelector('.spo-desc').focus();
    recalc();
  });
  recalc();
}

function printSupplierPODoc(po, sup, preparer) {

  if (!w) { alert('Please allow pop-ups to print.'); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
    <title>${escapeAttr(po.supplierPONumber || 'Purchase Order')}</title><style>

function openSupplierPOPreview(po, sup, preparer) {
  document.getElementById('spo-preview')?.remove();
  const wrap = document.createElement('div');
  wrap.id = 'spo-preview';
  wrap.className = 'fixed inset-0 z-50 bg-black/50 overflow-y-auto';
  wrap.innerHTML = `
    <style>${supplierPODocCSS(false)}</style>
    <div class="sticky top-0 z-10 flex items-center gap-2 bg-white border-b border-borderc px-4 py-2.5">

      <div class="flex-1"></div>

      <button type="button" id="spo-close" class="rounded-md border border-borderc bg-white px-4 py-2 text-sm text-charcoal hover:bg-cream">Close</button>
    </div>
    <div class="py-6 px-3 overflow-x-auto"><div style="width:794px;margin:0 auto;box-shadow:0 4px 24px rgba(0,0,0,.25)">${supplierPODocHTML(po, sup, preparer)}</div></div>`;
  document.body.appendChild(wrap);
  const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  document.getElementById('spo-close').addEventListener('click', close);
  document.getElementById('spo-print').addEventListener('click', () => printSupplierPODoc(po, sup, preparer));
  wrap.addEventListener('click', (e) => { if (e.target === wrap) close(); });
}
async function previewSupplierPOById(id) {
  try {
    const po = await fetchFinanceDoc('supplierPOs', id);
    if (!po) { alert('Supplier PO not found.'); return; }
    let sup = null;
    if (po.supplierId) { try { sup = await fetchFinanceDoc('suppliers', po.supplierId); } catch (e) { console.warn(e); } }
    let preparer = '';
    try {
      const users = await fetchFinanceCollection('users');
      const u = users.find(x => x.email && x.email === po.createdBy);
      preparer = (u && u.name) || '';
    } catch (e) { console.warn(e); }
    if (!preparer) preparer = po.createdBy ? String(po.createdBy).split('@')[0] : ((currentProfile && currentProfile.name) || '');
    openSupplierPOPreview(po, sup, preparer);
  } catch (e) {
    console.error(e);
    alert('Could not open the preview. Please try again.');
  }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-sp-preview]');
  if (b) previewSupplierPOById(b.getAttribute('data-sp-preview'));
});

function wireQuickSupplierPOStatus(reload) {
  document.querySelectorAll('[data-quick-supplier-po-status]').forEach(sel => {
    sel.addEventListener('change', async () => {
      const id = sel.getAttribute('data-quick-supplier-po-status');
      sel.disabled = true;
      try {
        await updateFinanceDoc('supplierPOs', id, { status: sel.value });
        await reload();
      } catch (e) {
        console.error(e);
        alert('Could not update status. Please try again.');
        sel.disabled = false;
      }
    });
  });
}

function readSupplierPOFormValues() {
  const val = (id) => { const el = document.getElementById('field-' + id); return el ? el.value.trim() : ''; };
  const paymentTermsType = val('paymentTermsType');
  const advancePaymentAmount = val('advancePaymentAmount') ? Number(val('advancePaymentAmount')) : null;
  const paymentTermsDays = val('paymentTermsDays');
  const customPaymentDays = val('customPaymentDays') ? Number(val('customPaymentDays')) : null;
  const supplierSel = document.getElementById('field-supplierId');
  const supplierId = supplierSel ? supplierSel.value : '';
  const supplierName = supplierSel && supplierId ? supplierSel.options[supplierSel.selectedIndex].text : '';
  const prSel = document.getElementById('field-prId');
  const prId = prSel ? prSel.value : '';
  const prNumber = prSel && prId ? prSel.options[prSel.selectedIndex].text.split(' — ')[0] : '';
  const items = [...document.querySelectorAll('#spo-rows .spo-row')].map(r => ({
    desc: r.querySelector('.spo-desc').value.trim(),
    qty: Number(r.querySelector('.spo-qty').value) || 0,
    price: Number(r.querySelector('.spo-price').value) || 0,
  })).filter(i => i.desc || i.price);
  const vatPct = Number((document.getElementById('spo-vat') || {}).value) || 0;
  const poTotals = spoTotals(items, vatPct);

/* ==========================================================================
   CASH MANAGEMENT MODULE  (Firestore-backed: bankAccounts, cashTransactions,
   bankReconciliations — balances computed from generalLedger entries
   tagged with a bankAccountId)
   ========================================================================== */
const BANK_ACCOUNT_TYPES = ['Checking', 'Savings', 'Cash', 'Other'];
const BANK_ACCOUNT_STATUSES = ['Active', 'Inactive'];

function maskAccountNumber(num) {
  if (!num) return '';
  const clean = String(num).replace(/\s+/g, '');
  return clean.length > 4 ? '••••' + clean.slice(-4) : clean;
}
async function fetchActiveBankAccounts() {
  const all = await fetchFinanceCollection('bankAccounts');
  // Every role that can raise a request sees the active accounts. (The Custodian used to be limited to
  // Cash funds, but with Cash no longer a Mode of Payment that left nothing to choose.)
  return all.filter(b => b.status !== 'Inactive');
}
function bankAccountSelectHtml(bankAccounts, selectedId, opts = {}) {
  return `
    <div>
      <label class="block text-sm font-medium text-charcoal mb-1.5">Bank Account${opts.required ? ' <span class="text-red-500">*</span>' : ''}</label>
      <select id="field-bankAccountId" ${opts.required ? 'required' : ''} class="w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest">
        <option value="">Select...</option>
        ${bankAccounts.map(b => `<option value="${b.id}" ${b.id === selectedId ? 'selected' : ''}>${escapeAttr(b.nickname)}${b.bankName ? ' — ' + escapeAttr(b.bankName) : ''}</option>`).join('')}
      </select>
    </div>`;
}
async function computeBankAccountBalances(bankAccounts) {
  const glEntries = await fetchFinanceCollection('generalLedger');
  const balances = {};
  bankAccounts.forEach(b => { balances[b.id] = Number(b.openingBalance) || 0; });
  glEntries.forEach(g => {
    if (g.bankAccountId && Object.prototype.hasOwnProperty.call(balances, g.bankAccountId)) {
      balances[g.bankAccountId] += (Number(g.debit) || 0) - (Number(g.credit) || 0);
    }
  });
  return balances;
}
async function computeBankAccountBalanceAsOf(bankAccountId, openingBalance, asOfDate) {
  const glEntries = await fetchFinanceCollection('generalLedger');
  let balance = Number(openingBalance) || 0;
  glEntries.forEach(g => {
    if (g.bankAccountId === bankAccountId && (!asOfDate || g.date <= asOfDate)) {
      balance += (Number(g.debit) || 0) - (Number(g.credit) || 0);
    }
  });
  return balance;
}

/* ---- Cash Forecast (fully automatic — reads AR/AP due dates) ---- */
async function renderCashForecastPage() {
  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">Cash Forecast</h1>
      <p class="text-sm text-muted mt-1">Projects future cash based on outstanding Accounts Receivable and Accounts Payable due dates.</p>
    </div>
    <div id="forecast-container" class="text-sm text-muted">Loading...</div>`);
  refreshIcons();
  try {
    const [bankAccounts, arEntries, apEntries] = await Promise.all([
      fetchFinanceCollection('bankAccounts'),
      fetchFinanceCollection('accountsReceivable'),
      fetchFinanceCollection('accountsPayable'),
    ]);
    const balances = await computeBankAccountBalances(bankAccounts);
    const currentCash = bankAccounts.reduce((sum, b) => sum + (balances[b.id] || 0), 0);

    const today = todayISO();
    function bucketFor(dueDate) {
      if (!dueDate) return 'No Due Date';
      if (dueDate < today) return 'Overdue';
      const days = Math.round((new Date(dueDate) - new Date(today)) / 86400000);
      if (days <= 7) return 'Next 7 Days';
      if (days <= 30) return '8–30 Days';
      if (days <= 60) return '31–60 Days';
      return '60+ Days';
    }
    const BUCKET_ORDER = ['Overdue', 'Next 7 Days', '8–30 Days', '31–60 Days', '60+ Days', 'No Due Date'];
    const buckets = {};
    BUCKET_ORDER.forEach(b => { buckets[b] = { inflow: 0, outflow: 0 }; });

    arEntries.filter(e => (Number(e.balance) || 0) > 0.01).forEach(e => {
      buckets[bucketFor(e.dueDate)].inflow += Number(e.balance) || 0;
    });
    apEntries.filter(e => (Number(e.balance) || 0) > 0.01).forEach(e => {
      buckets[bucketFor(e.dueDate)].outflow += Number(e.balance) || 0;
    });

    let running = currentCash;
    const rows = BUCKET_ORDER.map(b => {
      const net = buckets[b].inflow - buckets[b].outflow;
      running += net;
      return { bucket: b, inflow: buckets[b].inflow, outflow: buckets[b].outflow, net, running };
    });

    document.getElementById('forecast-container').innerHTML = `
      <div class="card p-5 mb-6 max-w-sm">
        <p class="text-xs font-medium text-muted uppercase tracking-wide">Current Cash (all accounts)</p>

            <th class="px-4 py-3">Period</th><th class="px-4 py-3 text-right">Expected In (AR)</th><th class="px-4 py-3 text-right">Expected Out (AP)</th><th class="px-4 py-3 text-right">Net</th><th class="px-4 py-3 text-right">Projected Balance</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr class="border-b border-borderc last:border-0">
                <td class="px-4 py-3 font-medium text-charcoal">${r.bucket}</td>
                <td class="px-4 py-3 text-right text-teal-700">${r.inflow ? formatCurrency(r.inflow) : '—'}</td>
                <td class="px-4 py-3 text-right text-red-600">${r.outflow ? formatCurrency(r.outflow) : '—'}</td>
                <td class="px-4 py-3 text-right ${r.net < 0 ? 'text-red-600' : 'text-charcoal'}">${formatCurrency(r.net)}</td>
                <td class="px-4 py-3 text-right font-medium">${formatCurrency(r.running)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="text-xs text-muted mt-3">Based on outstanding Accounts Receivable and Accounts Payable balances and their due dates as of today.</p>`;
  } catch (e) {
    console.error(e);
    document.getElementById('forecast-container').innerHTML = poLoadErrorHtml();
  }
}

function canApproveDisbursements(amount) {
  if (!currentProfile) return false;

/* ---- Payment execution (called when a voucher is approved, or marked paid) ---- */
async function executeRegularPaymentDV(dv) {
  const { sourceCollection, sourceId, amount, modeOfPayment, bankAccountId, bankAccountName, datePaid, number } = dv;
  if (sourceCollection === 'accountsPayable') {
    const ap = await fetchFinanceDoc('accountsPayable', sourceId);
    const newAmountPaid = Number(((ap.amountPaid || 0) + amount).toFixed(2));
    const newBalance = Number((ap.amount - newAmountPaid).toFixed(2));
    const newStatus = newBalance <= 0.01 ? 'Paid' : (newAmountPaid > 0 ? 'Partially Paid' : 'Unpaid');
    const payments = Array.isArray(ap.payments) ? [...ap.payments] : [];
    payments.push({ date: datePaid, amount, method: modeOfPayment, notes: `DV ${number}${dv.chequeNo ? ' — Cheque ' + dv.chequeNo : ''}`, bankAccountId, bankAccountName, recordedBy: currentUser ? currentUser.email : null });
    await updateFinanceDoc('accountsPayable', sourceId, { amountPaid: newAmountPaid, balance: newBalance, status: newStatus, payments });
    await postGLEntries([
      { date: datePaid, account: 'Accounts Payable', debit: amount, credit: 0, description: `Payment made — ${ap.payee} (DV ${number})`, sourceType: 'ap-payment', sourceId },
      { date: datePaid, account: bankAccountName, debit: 0, credit: amount, description: `Payment made — ${ap.payee} (DV ${number})`, sourceType: 'ap-payment', sourceId, bankAccountId },
    ]);
  } else if (sourceCollection === 'expenses') {
    const exp = await fetchFinanceDoc('expenses', sourceId);
    await updateFinanceDoc('expenses', sourceId, { status: 'Paid', datePaid, bankAccountId, bankAccountName });
    await postGLEntries([
      { date: datePaid, account: exp.category, debit: exp.amount, credit: 0, description: `Expense paid — ${exp.category} (DV ${number})`, sourceType: 'expense', sourceId },
      { date: datePaid, account: bankAccountName, debit: 0, credit: exp.amount, description: `Expense paid — ${exp.category} (DV ${number})`, sourceType: 'expense', sourceId, bankAccountId },
    ]);
  } else if (sourceCollection === 'taxRecords') {
    const tax = await fetchFinanceDoc('taxRecords', sourceId);
    await updateFinanceDoc('taxRecords', sourceId, { filingStatus: 'Paid', datePaid, bankAccountId, bankAccountName });
    await postGLEntries([
      { date: datePaid, account: 'Taxes Payable', debit: tax.taxAmount, credit: 0, description: `Tax paid (DV ${number})`, sourceType: 'tax', sourceId },
      { date: datePaid, account: bankAccountName, debit: 0, credit: tax.taxAmount, description: `Tax paid (DV ${number})`, sourceType: 'tax', sourceId, bankAccountId },
    ]);
  }
}

// Posts the actual GL entries for a Cash Advance liquidation. Only called
// once a liquidation has been Approved — submitting it just stores the
// draft (liquidationPending) and waits for review.
async function executeCashAdvanceLiquidation(ca, id, pending) {
  const { dateLiquidated, items, totalLiquidated, excess, shortfall, returnAccountId, returnAccountName } = pending;
  const glLines = items.map(i => ({
    date: dateLiquidated, account: i.category, debit: i.amount, credit: 0,
    description: `Cash advance liquidation — ${ca.number} (${i.description || i.category})`, sourceType: 'cash-advance-liquidation', sourceId: id,
  }));
  glLines.push({ date: dateLiquidated, account: ca.accountTitle || 'Advances to Employees', debit: 0, credit: ca.amount, description: `Cash advance liquidation — ${ca.number}`, sourceType: 'cash-advance-liquidation', sourceId: id });

  let shortfallAPId = null;
  if (excess > 0) {
    glLines.push({ date: dateLiquidated, account: returnAccountName, debit: excess, credit: 0, description: `Cash advance excess returned — ${ca.number}`, sourceType: 'cash-advance-liquidation', sourceId: id, bankAccountId: returnAccountId });
  } else if (shortfall > 0) {
    const apRef = await createFinanceDoc('accountsPayable', {
      source: 'cash-advance-shortfall', payee: ca.employeeName, category: ca.accountTitle || 'Advances to Employees',
      amount: shortfall, amountPaid: 0, balance: shortfall, status: 'Unpaid', payments: [],
      dateReceived: dateLiquidated, dueDate: '', description: `Cash advance shortfall reimbursement — ${ca.number}`,
    });
    shortfallAPId = apRef.id;
    glLines.push({ date: dateLiquidated, account: 'Accounts Payable', debit: 0, credit: shortfall, description: `Cash advance shortfall — ${ca.number}`, sourceType: 'ap-payment', sourceId: apRef.id });
  }
  await postGLEntries(glLines);
  return shortfallAPId;
}

//   Outstanding - approved and issued, not yet cleared or released
//   Cleared     - deposited by the supplier into their own account
//   Released    - encashed by MTISI itself
const CHEQUE_STATUSES = ['Outstanding', 'Cleared', 'Released'];
function chequeStatusOf(v) { return v.chequeStatus || 'Outstanding'; }

function summarizeCheques(rows) {
  const out = { count: rows.length, total: 0 };
  CHEQUE_STATUSES.forEach(s => { out[s] = { count: 0, sum: 0 }; });

    const amt = Number(v.amount) || 0;
    const s = chequeStatusOf(v);
    out.total += amt; out[s].count += 1; out[s].sum += amt;
  });
  return out;
