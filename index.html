    const current = chequeStatusOf(v);
    const panel = document.getElementById('chq-prompt');
    panel.innerHTML = `
      <div class="card p-4 max-w-2xl mb-4">
        <p class="text-sm font-medium text-charcoal mb-1">Update Cheque Status</p>
        <p class="text-xs text-muted mb-3">Cheque <span class="font-medium text-charcoal">${escapeAttr(v.chequeNo)}</span> · ${escapeAttr(v.payee) || '—'} · ${formatCurrency(v.amount)}</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-charcoal mb-1">Cheque Status</label>
            <select id="chq-new-status" class="${inputCls}">
              <option value="Outstanding" ${current === 'Outstanding' ? 'selected' : ''}>Outstanding</option>
              <option value="Cleared" ${current === 'Cleared' ? 'selected' : ''}>Cleared — deposited by the supplier</option>
              <option value="Released" ${current === 'Released' ? 'selected' : ''}>Released — encashed by MTISI</option>
            </select>
          </div>
          <div id="chq-date-wrap" class="${current === 'Outstanding' ? 'hidden' : ''}">
            <label id="chq-date-label" class="block text-xs font-medium text-charcoal mb-1">Date</label>
            <input id="chq-new-date" type="date" value="${v.chequeStatusDate || todayISO()}" ${v.dateApproved ? `min="${v.dateApproved}"` : ''} max="${todayISO()}" class="${inputCls}" />
          </div>
        </div>
        <p id="chq-panel-error" class="hidden text-xs text-red-600 mt-2"></p>
        <div class="flex gap-3 mt-3">
          <button type="button" id="chq-panel-save" class="btn-glass-sm text-sm">Save</button>
          <button type="button" id="chq-panel-dismiss" class="text-sm text-muted hover:text-charcoal">Nevermind</button>
        </div>
      </div>`;
    const statusSel = document.getElementById('chq-new-status');
    const dateWrap = document.getElementById('chq-date-wrap');
    const dateLabel = document.getElementById('chq-date-label');
    const syncDateField = () => {
      dateWrap.classList.toggle('hidden', statusSel.value === 'Outstanding');
      dateLabel.textContent = statusSel.value === 'Cleared' ? 'Date Cleared' : statusSel.value === 'Released' ? 'Date Released' : 'Date';
    };
    syncDateField();
    statusSel.addEventListener('change', syncDateField);
    document.getElementById('chq-panel-dismiss').addEventListener('click', () => { panel.innerHTML = ''; });
    document.getElementById('chq-panel-save').addEventListener('click', async () => {
      const errEl = document.getElementById('chq-panel-error');
      const btn = document.getElementById('chq-panel-save');
      const status = statusSel.value;
      const date = document.getElementById('chq-new-date').value;
      const problem = chequeStatusChangeProblem(status, date, v, todayISO());
      if (problem) { errEl.textContent = problem; errEl.classList.remove('hidden'); return; }
      errEl.classList.add('hidden');
      btn.disabled = true;
      try {
        const patch = {
          chequeStatus: status,
          chequeStatusDate: status === 'Outstanding' ? null : date,
          chequeStatusBy: currentUser ? currentUser.email : null,
        };
        await updateFinanceDoc('disbursementVouchers', v.id, patch);
        Object.assign(v, patch);
        panel.innerHTML = '';
        renderFiltered();
      } catch (err) {
        console.error(err);
        errEl.textContent = 'Could not save this change. Please try again.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
      }
    });
  };

  const renderFiltered = () => {
    const q = document.getElementById('chq-search').value.trim().toLowerCase();
    const bank = document.getElementById('chq-bank').value;
    const status = document.getElementById('chq-status').value;
    const rows = cheques.filter(v =>
      (!bank || v.bankAccountId === bank) &&
      (!status || chequeStatusOf(v) === status) &&
      (!q || [v.chequeNo, v.payee, v.number].some(x => String(x || '').toLowerCase().includes(q))));
    const sm = summarizeCheques(rows);
    document.getElementById('chq-summary').innerHTML = rows.length ? `
      <span>${sm.count} cheque${sm.count === 1 ? '' : 's'} · Total <span class="font-medium text-charcoal">${formatCurrency(sm.total)}</span></span>
      <span class="mx-2">|</span>
      <span class="text-amber-700">Outstanding ${formatCurrency(sm.Outstanding.sum)} (${sm.Outstanding.count})</span>
      <span class="mx-2">·</span><span class="text-teal-700">Cleared ${formatCurrency(sm.Cleared.sum)} (${sm.Cleared.count})</span>
      <span class="mx-2">·</span><span class="text-blue-700">Released ${formatCurrency(sm.Released.sum)} (${sm.Released.count})</span>` : '';
    document.getElementById('chq-container').innerHTML = rows.length ? `
      <div class="card overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="border-b border-borderc text-left text-xs text-muted uppercase tracking-wide">
            <th class="px-4 py-3">Cheque No.</th><th class="px-4 py-3">DV #</th><th class="px-4 py-3">Payee</th><th class="px-4 py-3">Amount</th><th class="px-4 py-3">Bank Account</th><th class="px-4 py-3">Date Approved</th><th class="px-4 py-3">Voucher Status</th><th class="px-4 py-3">Cheque Status</th><th class="px-4 py-3 text-right">Actions</th>
          </tr></thead>
          <tbody>
            ${rows.map(v => `
              <tr class="border-b border-borderc last:border-0 hover:bg-cream/50">
                <td class="px-4 py-3 font-medium text-charcoal">${escapeAttr(v.chequeNo)}${Array.isArray(v.chequeHistory) && v.chequeHistory.length ? ' <span class="ml-1 text-xs font-normal text-amber-700">reissued</span>' : ''}</td>
                <td class="px-4 py-3">${v.number}</td>
                <td class="px-4 py-3">${escapeAttr(v.payee) || '—'}</td>
                <td class="px-4 py-3">${formatCurrency(v.amount)}</td>
                <td class="px-4 py-3">${escapeAttr(v.bankAccountName) || '—'}</td>
                <td class="px-4 py-3">${formatDate(v.dateApproved)}</td>
                <td class="px-4 py-3">${dvStatusBadge(v.status)}</td>
                <td class="px-4 py-3">${chequeStatusBadge(v)}</td>
                <td class="px-4 py-3 text-right">
                  ${canUpdate ? `<button type="button" class="btn-glass-sm chq-update-btn" data-id="${v.id}">Update Status</button> ` : ''}
                  <a href="#/disbursement/vouchers/view/${v.id}" class="btn-glass-sm">View</a>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : `<div class="card flex flex-col items-center justify-center text-center py-16 px-6">
        <p class="text-sm text-muted">${cheques.length ? 'No cheques match your filters.' : 'No approved cheque payments yet.'}</p>
      </div>`;
    document.querySelectorAll('.chq-update-btn').forEach(b =>
      b.addEventListener('click', () => openStatusPanel(cheques.find(c => c.id === b.dataset.id))));
    refreshIcons();
  };
  renderFiltered();
  document.getElementById('chq-search').addEventListener('input', renderFiltered);
  document.getElementById('chq-status').addEventListener('change', renderFiltered);
  document.getElementById('chq-bank').addEventListener('change', renderFiltered);
}

async function renderNewDisbursementVoucherPage(sourceCollection, sourceId) {
  contentWrap(`<div class="text-sm text-muted">Loading...</div>`);
  let sourceRecord, bankAccounts = [];
  try {
    [sourceRecord, bankAccounts] = await Promise.all([fetchFinanceDoc(sourceCollection, sourceId), fetchActiveBankAccounts()]);
  } catch (e) {
    console.error(e);
    contentWrap(poLoadErrorHtml());
    return;
  }
  if (!sourceRecord) {
    contentWrap(`<div class="card flex flex-col items-center justify-center text-center py-16 px-6"><p class="text-sm text-charcoal font-medium">Record not found.</p><a href="#/disbursement/vouchers" class="mt-4 text-sm text-forest hover:underline">Back to Disbursement Vouchers</a></div>`);
    return;
  }

  let payee, accountTitle, maxAmount, defaultAmount, backHref;
  if (sourceCollection === 'accountsPayable') {
    payee = sourceRecord.payee || sourceRecord.clientName;
    accountTitle = sourceRecord.category || 'Accounts Payable';
    maxAmount = sourceRecord.balance;
    defaultAmount = sourceRecord.balance;
    backHref = 'finance/accounts-payable';
  } else if (sourceCollection === 'expenses') {
    payee = sourceRecord.payee || sourceRecord.category;
    accountTitle = sourceRecord.category;

    backHref = 'finance/expenses';

    payee = `${sourceRecord.taxType} — ${sourceRecord.period}`;
    accountTitle = 'Taxes & Licenses Expense';
    maxAmount = sourceRecord.taxAmount;
    defaultAmount = sourceRecord.taxAmount;
    backHref = 'finance/tax';
  }

  contentWrap(`
    <div class="mb-6">
      <h1 class="text-xl font-semibold text-charcoal">Request Disbursement</h1>
      <p class="text-sm text-muted mt-1">${escapeAttr(payee)} · ${escapeAttr(accountTitle)}</p>

        ${dateField('dvDate', 'Date Requested', { required: true, value: todayISO() })}
        ${modeOfPaymentFieldHtml('Cash', '')}
        ${bankAccountSelectHtml(bankAccounts, null, { required: true })}
        ${textareaField('dvPurpose', 'Purpose / Description', { span2: true, value: `Payment — ${accountTitle}` })}
      </div>
      <div class="flex items-center gap-3 pt-2 border-t border-borderc">
        <button id="dv-req-preview-btn" type="button" class="btn-primary">Preview</button>
        <a href="#/${backHref}" class="text-sm text-muted hover:text-charcoal">Cancel</a>
      </div>
    </form>
    <div id="dv-preview-wrap" class="hidden"></div>`);
  refreshIcons();
  wireModeOfPaymentToggle(bankAccounts);

  document.getElementById('dv-req-preview-btn').addEventListener('click', async () => {
    const errBox = document.getElementById('dv-req-form-error');
    errBox.classList.add('hidden');
    const amount = Number(document.getElementById('field-dvAmount').value) || 0;
    const date = document.getElementById('field-dvDate').value;
    const modeOfPayment = document.getElementById('field-modeOfPayment').value;
    const purpose = document.getElementById('field-dvPurpose').value.trim();

    const bankAccountId = bankSel.value;
    const bankAccountName = bankAccountId ? bankSel.options[bankSel.selectedIndex].text : '';

    if (!amount || amount <= 0 || !date || !bankAccountId) {
      errBox.textContent = 'Please fill in all required fields.';
      errBox.classList.remove('hidden');
      return;
    }
    if (maxAmount != null && amount > maxAmount + 0.01) {
      errBox.textContent = `Amount cannot exceed ${formatCurrency(maxAmount)}.`;
      errBox.classList.remove('hidden');
      return;

    const previewNumber = await generateSeriesNumber('disbursementVouchers', 'DV', 'number');
    const draft = {

      modeOfPayment, bankAccountId, bankAccountName, accountTitle,
      sourceCollection, sourceId, requestedBy: currentUser ? currentUser.email : null, dateRequested: date,

    document.getElementById('dv-req-form').classList.add('hidden');
    const wrap = document.getElementById('dv-preview-wrap');
    wrap.classList.remove('hidden');
    wrap.innerHTML = `
      <div class="relative card p-8 max-w-3xl mx-auto" id="voucher-print-area">
        ${voucherStampHtml('Pending')}
        ${voucherLetterheadHtml('Disbursement Voucher', 'DV No.', draft.number, dvStatusLabel('Pending'), 'Date Requested', formatDate(draft.dateRequested))}

          <div><p class="text-xs text-muted uppercase">Amount</p><p class="font-semibold text-forest mt-0.5">${formatCurrency(draft.amount)}</p></div>
          <div><p class="text-xs text-muted uppercase">Account Title</p><p class="font-medium text-charcoal mt-0.5">${escapeAttr(draft.accountTitle)}</p></div>
          <div><p class="text-xs text-muted uppercase">Mode of Payment</p><p class="font-medium text-charcoal mt-0.5">${draft.modeOfPayment}</p></div>
          ${chequeNoCellHtml(draft)}
          <div><p class="text-xs text-muted uppercase">Bank/Cash Account</p><p class="font-medium text-charcoal mt-0.5">${escapeAttr(draft.bankAccountName)}</p></div>
          <div><p class="text-xs text-muted uppercase">Requested By</p><p class="font-medium text-charcoal mt-0.5">${escapeAttr(draft.requestedBy)}</p></div>

          <div><p class="text-xs text-muted">Approved By</p><div class="h-10 border-b border-borderc mt-6"></div></div>

      <div id="dv-preview-error" class="hidden max-w-2xl mx-auto mt-3 text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>
      <div class="max-w-2xl mx-auto mt-4 flex gap-3 print:hidden">

        <button type="button" id="dv-preview-back" class="text-sm text-muted hover:text-charcoal">Back to Edit</button>
      </div>`;
    refreshIcons();

    document.getElementById('dv-preview-back').addEventListener('click', () => {
      wrap.classList.add('hidden');
      wrap.innerHTML = '';
      document.getElementById('dv-req-form').classList.remove('hidden');
    });
    document.getElementById('dv-preview-confirm').addEventListener('click', async () => {
      const btn = document.getElementById('dv-preview-confirm');
      const perr = document.getElementById('dv-preview-error');
      perr.classList.add('hidden');
      btn.disabled = true; btn.innerHTML = spinnerHtml();
      try {
        await createFinanceDoc('disbursementVouchers', { ...draft, status: 'Pending' });
        refreshApprovalsBadge();
        navigateTo('disbursement/vouchers');
      } catch (err) {
        console.error(err);
        perr.textContent = 'Could not submit this voucher. Please try again.';
        perr.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Confirm & Submit';
      }
    });
  });
}

// A cheque number is unique per bank account. Returns a message if it can't be used, else null.
async function chequeNoProblem(chequeNo, v, id, isCorrection) {
  const wanted = chequeNo.trim().toLowerCase();
  if (isCorrection && (v.chequeNo || '').trim().toLowerCase() === wanted) return "That is already this voucher's Cheque No.";
  const all = await fetchFinanceCollection('disbursementVouchers');
  const clash = all.find(x => x.id !== id && x.status !== 'Cancelled' && x.status !== 'Rejected'
    && x.bankAccountId === v.bankAccountId && (x.chequeNo || '').trim().toLowerCase() === wanted);
  return clash ? `Cheque No. ${chequeNo} is already used on ${clash.number} for this account.` : null;
}
// Keeps the cheque number shown on an Accounts Payable payment record in step with the voucher.
async function syncChequeNoToAPPayment(v, newNo) {
  if (v.type !== 'Regular Payment' || v.sourceCollection !== 'accountsPayable' || v.status !== 'Paid') return;
  try {
    const ap = await fetchFinanceDoc('accountsPayable', v.sourceId);
    if (!ap || !Array.isArray(ap.payments)) return;
    const prefix = `DV ${v.number}`;
    const payments = ap.payments.map(p => (p.notes || '').startsWith(prefix) ? { ...p, notes: `${prefix} — Cheque ${newNo}` } : p);
    await updateFinanceDoc('accountsPayable', v.sourceId, { payments });
  } catch (e) { console.error(e); }
}
// Replaces the cheque number on an approved voucher and keeps the old one in its history.
async function applyChequeCorrection(v, id, newNo, reason) {
  const history = [...(Array.isArray(v.chequeHistory) ? v.chequeHistory : []),
    { from: v.chequeNo || '', to: newNo, reason, changedBy: currentUser ? currentUser.email : null, date: todayISO() }];
  await updateFinanceDoc('disbursementVouchers', id, { chequeNo: newNo, chequeHistory: history });
  await syncChequeNoToAPPayment(v, newNo);
}

      errBox.classList.remove('hidden');
      setBusy(false);
    }

      validate: (newNo) => chequeNoProblem(newNo, v, id, true),

/* ==========================================================================
   BILLING & COLLECTION — Unbilled Fulfillment, Invoices, Collections, Official Receipts, AR Aging
   ========================================================================== */

// ---- dates (all in UTC so the Philippine timezone can't shift a day) ----
function addDaysISO(iso, days) {
  const t = Date.parse(iso + 'T00:00:00Z');
  if (!Number.isFinite(t)) return '';
  return new Date(t + days * 86400000).toISOString().slice(0, 10);
}
function daysBetweenISO(fromISO, toISO) {
  const a = Date.parse(fromISO + 'T00:00:00Z'), b = Date.parse(toISO + 'T00:00:00Z');
  return Number.isFinite(a) && Number.isFinite(b) ? Math.round((b - a) / 86400000) : null;
}
// Latest date found in free text such as "12 Sep 2026 (partial), 20 Sep 2026 (final)". ISO, or '' if none.
function latestDateIn(text) {
  const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  const pad = (n) => String(n).padStart(2, '0');
  const s = String(text || '');
  const found = s.match(/\d{4}-\d{2}-\d{2}/g) || [];
  let m;
  const dayFirst = /(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4})/g;
  while ((m = dayFirst.exec(s))) {
    const mo = MONTHS[m[2].slice(0, 3).toLowerCase()];
    if (mo) found.push(`${m[3]}-${pad(mo)}-${pad(m[1])}`);
  }
  const monthFirst = /([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/g;
  while ((m = monthFirst.exec(s))) {
    const mo = MONTHS[m[1].slice(0, 3).toLowerCase()];
    if (mo) found.push(`${m[3]}-${pad(mo)}-${pad(m[2])}`);
  }
  return found.sort().pop() || '';
}

// ---- amount in words, for the Official Receipt ----
function amountInWords(amount) {
  const total = Math.round((Number(amount) || 0) * 100);
  const pesos = Math.floor(total / 100), cents = total % 100;
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const underThousand = (n) => {
    const parts = [];
    if (n >= 100) { parts.push(ones[Math.floor(n / 100)] + ' Hundred'); n %= 100; }
    if (n >= 20) parts.push(tens[Math.floor(n / 10)] + (n % 10 ? '-' + ones[n % 10] : ''));
    else if (n > 0) parts.push(ones[n]);
    return parts.join(' ');
  };
  const scales = ['', ' Thousand', ' Million', ' Billion', ' Trillion'];
  let words = '', n = pesos, i = 0;
  if (n === 0) words = 'Zero';
  while (n > 0) {
    const chunk = n % 1000;
    if (chunk) words = underThousand(chunk) + scales[i] + (words ? ' ' + words : '');
    n = Math.floor(n / 1000); i++;
  }
  return `${words} ${pesos === 1 ? 'Peso' : 'Pesos'}${cents ? ` and ${String(cents).padStart(2, '0')}/100` : ''} Only`;
}

// ---- when a receivable is due, and how old it is ----
// Days of credit the PO gives: "Net 30" -> 30, Custom -> the number entered. COD, advance payment, or no terms: 0.
function poTermsDays(po) {
  if (!po || po.paymentTermsType !== 'Terms') return 0;
  const raw = po.paymentTermsDays === 'Custom' ? po.customPaymentDays : po.paymentTermsDays;
  const n = parseInt(String(raw == null ? '' : raw).replace(/[^0-9]/g, ''), 10);
  return Number.isFinite(n) ? n : 0;
}
// The due date on the record, else worked out from the PO's payment terms (counted from the invoice date).
// Revenue account a recognized sale is posted to, by the PO's type.
function salesRevenueAccountFor(po) {
  return po && (po.poType === 'Service' || po.poType === 'Installation') ? 'Service Revenue' : 'Sales – Materials / Products';
}
function arDueDate(ar, po) {
  if (ar.dueDate) return ar.dueDate;
  return ar.dateCreated ? addDaysISO(ar.dateCreated, poTermsDays(po)) : '';
}
function arDaysOverdue(ar, po, today) {
  const due = arDueDate(ar, po);
  const d = due ? daysBetweenISO(due, today) : 0;
  return d && d > 0 ? d : 0;
}
// Balance on a given date, rebuilt from the payment history so the aging report can look back.
function arBalanceAsOf(ar, asOf) {
  if (ar.dateCreated && ar.dateCreated > asOf) return 0;
  const paid = (Array.isArray(ar.payments) ? ar.payments : [])
    .filter(p => p.date && p.date <= asOf)
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
  return Math.max(0, Number(((Number(ar.amount) || 0) - paid).toFixed(2)));
}
const AGING_BUCKETS = ['Current', '1–30 days', '31–60 days', '61–90 days', 'Over 90 days'];
function agingBucketIndex(daysPastDue) {
  if (daysPastDue == null || daysPastDue <= 0) return 0;
  if (daysPastDue <= 30) return 1;
  if (daysPastDue <= 60) return 2;
  if (daysPastDue <= 90) return 3;
  return 4;
}
function buildARAging(receivables, poById, asOf) {
  const byClient = {};
  const totals = [0, 0, 0, 0, 0];
  receivables.forEach(ar => {
    const bal = arBalanceAsOf(ar, asOf);
    if (bal <= 0.005) return;
    const due = arDueDate(ar, poById[ar.poId]);
    const b = agingBucketIndex(due ? daysBetweenISO(due, asOf) : 0);
    const key = ar.clientName || '—';
    const row = byClient[key] || (byClient[key] = { client: key, buckets: [0, 0, 0, 0, 0], total: 0, count: 0 });
    row.buckets[b] += bal; row.total += bal; row.count += 1; totals[b] += bal;
  });
  const rows = Object.values(byClient).sort((a, b) => b.total - a.total);
  return { rows, totals, grand: totals.reduce((s, x) => s + x, 0) };
}

// ---- unbilled fulfillment: delivered, but not yet recognized as a sale ----
const UNBILLED_STATUSES = ['Ready for Billing', 'Complete Delivery', 'Partial Delivery'];
function selectUnbilledFulfillment(pos) {
  return pos
    .filter(p => !p.salesRecognized && UNBILLED_STATUSES.includes(p.status))
    .sort((a, b) => UNBILLED_STATUSES.indexOf(a.status) - UNBILLED_STATUSES.indexOf(b.status)
      || (Number(b.poAmount) || 0) - (Number(a.poAmount) || 0));
}

// ---- collections follow-ups ----
function lastFollowUp(ar) {
  const notes = Array.isArray(ar.collectionNotes) ? ar.collectionNotes : [];
  return notes.length ? notes[notes.length - 1] : null;
}
// 'due' = the agreed next follow-up date has come; 'none' = overdue and nobody has chased it yet
function followUpState(ar, daysOverdue, today) {
  const last = lastFollowUp(ar);
  if (!last) return daysOverdue > 0 ? 'none' : 'ok';
  return last.nextFollowUp && last.nextFollowUp <= today ? 'due' : 'ok';
}

// ---- Official Receipts ----
async function createOfficialReceipt(ar, arId, payment, balanceAfter) {
  const number = await generateSeriesNumber('officialReceipts', 'OR');
  const ref = await createFinanceDoc('officialReceipts', {
    number, arId, poId: ar.poId || null,
    clientName: ar.clientName || '', reference: ar.clientPONumber || ar.description || '',
    amount: Number(payment.amount) || 0, date: payment.date, method: payment.method || '',
    bankAccountId: payment.bankAccountId || null, bankAccountName: payment.bankAccountName || '',
    notes: payment.notes || '', balanceAfter,
    issuedBy: currentUser ? currentUser.email : null,
  });
  return { id: ref.id, number };
}
// For payments recorded before Official Receipts existed (or whose receipt failed to issue).
async function issueOfficialReceiptForPayment(arId, paymentIndex) {
  const ar = await fetchFinanceDoc('accountsReceivable', arId);
  const payments = Array.isArray(ar && ar.payments) ? [...ar.payments] : [];
  const p = payments[paymentIndex];
  if (!p) throw new Error('Payment not found');
  if (p.orId) return { id: p.orId, number: p.orNumber };
  const paidThrough = payments.slice(0, paymentIndex + 1).reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const balanceAfter = Math.max(0, Number(((Number(ar.amount) || 0) - paidThrough).toFixed(2)));
  const or = await createOfficialReceipt(ar, arId, p, balanceAfter);
  payments[paymentIndex] = { ...p, orId: or.id, orNumber: or.number };
  await updateFinanceDoc('accountsReceivable', arId, { payments });
  return or;
}

    document.getElementById('col-container').innerHTML = rows.length ? `

        <table class="w-full text-sm">
          <thead><tr class="border-b border-borderc text-left text-xs text-muted uppercase tracking-wide">

          </tr></thead>

                <td class="px-4 py-3 font-medium text-charcoal">${escapeAttr(r.a.clientName) || '—'}</td>
                <td class="px-4 py-3">${escapeAttr(r.a.clientPONumber || r.a.description) || '—'}</td>
                <td class="px-4 py-3 font-medium">${formatCurrency(r.a.balance)}</td>
                <td class="px-4 py-3">${formatDate(r.due)}</td>
                <td class="px-4 py-3">${r.overdueDays > 0 ? `<span class="text-red-600 font-medium">${r.overdueDays} day${r.overdueDays === 1 ? '' : 's'}</span>` : '<span class="text-muted">—</span>'}</td>
                <td class="px-4 py-3 max-w-[260px]">${r.last ? `<p class="text-xs text-muted">${formatDate(r.last.date)}</p><p class="truncate" title="${escapeAttr(r.last.note)}">${escapeAttr(r.last.note)}</p>` : '<span class="text-muted">—</span>'}</td>

                <td class="px-4 py-3 text-right whitespace-nowrap">

                </td>
              </tr>`).join('')}
          </tbody>
        </table>

  };

  const renderMissing = () => {
    const el = document.getElementById('or-missing');
    el.innerHTML = missing.length ? `
      <h2 class="text-sm font-semibold text-charcoal mb-1">Payments without an Official Receipt</h2>

              </tr>`).join('')}
          </tbody>
        </table>
      </div>` : '';
    el.querySelectorAll('.or-issue-btn').forEach(b => b.addEventListener('click', async () => {
      const m = missing[Number(b.dataset.i)];
      b.disabled = true; b.textContent = 'Issuing...';
      try {

/* ---- Cash Advances ---- */
// The account a Cash Advance is charged to when it is released, and cleared from when it is liquidated.
// Any account in the Chart of Accounts will do except Cash and the receivable/payable control accounts.
function advanceAccountChoices(extra) {
  // An advance is charged to something the company owns or spends on — not to liabilities, equity or revenue.
  const list = ACCOUNTS_CHART.filter(a => !CASH_LIKE_ACCOUNTS.includes(a)
    && !['Accounts Receivable', 'Accounts Payable'].includes(a)
    && ['Asset', 'COGS', 'Expense', 'Other Expense'].includes(ACCOUNT_TYPE_BY_NAME[a]));
  if (extra && !list.includes(extra)) list.push(extra);
  return list;
}
// Suggested account for each advance type, from whatever is in the Chart of Accounts.
function defaultAdvanceAccount(type, choices) {
  const find = (re) => choices.find(a => re.test(a)) || '';
  if (type === 'Materials Purchase') return find(/material|purchase/i);
  if (type === 'Equipment Purchase') return find(/equipment/i);
  return choices.includes('Advances to Employees') ? 'Advances to Employees' : find(/^other current assets$/i);
}
// "Unliquidated" = money has been released and the advance hasn't been liquidated yet.
function isUnliquidated(a) { return a.status === 'Outstanding' || a.status === 'Pending Liquidation Review'; }
// Every unliquidated advance for one person, oldest first. Matches on the name as typed (ignoring case).
function unliquidatedAdvancesFor(advances, name) {
  const wanted = (name || '').trim().toLowerCase();
  if (!wanted) return [];
  return advances
    .filter(a => (a.employeeName || '').trim().toLowerCase() === wanted && isUnliquidated(a))
    .sort((a, b) => String(a.dateReleased || '').localeCompare(String(b.dateReleased || '')));
}
function unliquidatedAdvancesHtml(list) {
  const total = list.reduce((s, a) => s + (Number(a.amount) || 0), 0);
  const rows = list.map(a => {
    const days = a.dateReleased ? Math.round((new Date(todayISO()) - new Date(a.dateReleased)) / 86400000) : null;
    return `<li class="flex flex-wrap items-center gap-x-2 py-1 border-t border-amber-200 first:border-0">
      <a href="#/disbursement/cash-advances/view/${a.id}" target="_blank" rel="noopener" class="font-medium underline">${escapeAttr(a.number)}</a>
      <span>${formatCurrency(a.amount)}</span>
      <span>· ${escapeAttr(a.type || '—')}</span>
      <span>· ${a.dateReleased ? 'released ' + formatDate(a.dateReleased) + (days != null ? ` (${days} day${days === 1 ? '' : 's'} ago)` : '') : 'not yet released'}</span>
      <span>· ${escapeAttr(a.status)}</span>
      ${isCAOverdue(a) ? '<span class="font-medium text-red-600">· overdue</span>' : ''}
    </li>`;
  }).join('');
  return `<p class="font-medium">${escapeAttr(list[0].employeeName)} has ${list.length} unliquidated cash advance${list.length === 1 ? '' : 's'} (${formatCurrency(total)} in total):</p><ul class="mt-1">${rows}</ul>`;
}
// A cash fund can't pay out more than it holds. Returns a message if paying this voucher would
// overdraw its cash fund, otherwise null. Bank accounts are not checked.
async function cashFundShortfallMessage(v, action) {
  if (!v.bankAccountId) return null;
  const acc = await fetchFinanceDoc('bankAccounts', v.bankAccountId);
  if (!acc || acc.accountType !== 'Cash') return null;
  const balances = await computeBankAccountBalances([{ ...acc, id: v.bankAccountId }]);
  const balance = balances[v.bankAccountId] || 0;
  if ((Number(v.amount) || 0) <= balance + 0.005) return null;
  return `${acc.nickname} only holds ${formatCurrency(balance)}, which is less than this ${formatCurrency(v.amount)}. Top the fund up first with a Fund Transfer, then ${action}.`;
}
function isCAOverdue(ca) {
  if (ca.status !== 'Outstanding' || !ca.dateReleased) return false;
  return Math.round((new Date(todayISO()) - new Date(ca.dateReleased)) / 86400000) > CA_AGING_DAYS;
}
function caAgingBadge(ca) {
  if (!isCAOverdue(ca)) return '';
  const days = Math.round((new Date(todayISO()) - new Date(ca.dateReleased)) / 86400000);
  return `<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border bg-red-50 text-red-600 border-red-200">${days}d overdue</span>`;
}

      errBox.classList.remove('hidden');

/* ---- Customer List (Settings) ----
   Master list behind every Client Name dropdown. Filled by pulling all CRM
   Accounts and Leads, plus customers that are not in CRM. Stored in the
   Firestore "clients" collection. */
const CUSTOMER_NAME_KEYS = ['company', 'companyName', 'name', 'accountName', 'customerName', 'businessName', 'clientName', 'organization'];
async function ensureCustomerExists(name, source, department) {
  const n = normClientName(name);
  if (!n || !db) return;
  const list = await loadClientList();
  if (list.has(n.toLowerCase())) return;
  const id = 'so-' + n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
  try {
    const ref = doc(db, 'clients', id);
    if ((await getDoc(ref)).exists()) return; // already there (maybe switched off on purpose)
    await setDoc(ref, { name: n, department: department || '', source, isActive: true, createdAt: serverTimestamp(), createdBy: currentUser ? currentUser.email : null });
    addToClientCache(n, source, department);
  } catch (e) { console.warn('Could not add customer to the list:', e.code || e); }
}
async function pullCRMCustomers() {
  if (!crmReady || !crmDb) throw new Error('CRM connection is not configured.');
  const existing = await fetchFinanceCollection('clients');
  const have = new Set(existing.map(c => normClientName(c.name).toLowerCase()));
  const found = [];
  let readable = 0;
  for (const [coll, source] of [['accounts', 'CRM Account'], ['leads', 'CRM Lead']]) {
    try {
      const snap = await getDocs(collection(crmDb, coll));
      readable++;
      snap.docs.forEach(d => {
        const r = d.data();
        const k = CUSTOMER_NAME_KEYS.find(key => typeof r[key] === 'string' && r[key].trim());
        if (k) found.push({ id: `crm-${coll}-${d.id}`, name: normClientName(r[k]), department: holderOf(r), source, crmId: d.id });
      });
    } catch (e) { console.warn('CRM ' + coll + ' not readable:', e.code || e); }
  }
  if (!readable) throw new Error('CRM accounts and leads could not be read. In the CRM project, allow read on the accounts and leads collections in Firestore Rules.');
  const toAdd = [];
  let already = 0;
  found.forEach(c => {
    const k = c.name.toLowerCase();
    if (have.has(k)) { already++; return; }
    have.add(k);
    toAdd.push(c);
  });
  for (let i = 0; i < toAdd.length; i += 20) {
    await Promise.all(toAdd.slice(i, i + 20).map(c => setDoc(doc(db, 'clients', c.id), {
      name: c.name, department: c.department, source: c.source, crmId: c.crmId, isActive: true,
      createdAt: serverTimestamp(), createdBy: currentUser ? currentUser.email : null,
    })));
  }
  clientListCache = null;
  return { added: toAdd.length, accounts: toAdd.filter(c => c.source === 'CRM Account').length, leads: toAdd.filter(c => c.source === 'CRM Lead').length, already };
}

/* ---- Add Team Member (System Admin) ----
   Creating an Auth user from the browser normally signs the creator out and
   signs in as the new user. To avoid that we use a second, separate Firebase
   app instance just for creating the account, then sign it out. The admin's
   own session is never touched. */
let teamCreatorApp = null;
const TEAM_DEPARTMENTS = ['Administration', 'Finance', 'Operations', 'Procurement', 'Installation & Projects'];

function addTeamMemberModalHtml() {
  const input = 'w-full rounded-md border border-borderc bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-forest';
  return `

          <div id="add-team-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>
          <div><label class="block text-sm font-medium text-charcoal mb-1.5">Full Name</label>
            <input id="at-name" type="text" required class="${input}" placeholder="Juan Dela Cruz" /></div>
          <div><label class="block text-sm font-medium text-charcoal mb-1.5">ID Number (Login Name)</label>
            <input id="at-id" type="text" required autocapitalize="characters" spellcheck="false" class="${input}" placeholder="MTISI-00007" /></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-sm font-medium text-charcoal mb-1.5">Department</label>
              <select id="at-dept" class="${input}">${TEAM_DEPARTMENTS.map(d => `<option value="${d}" ${d === 'Operations' ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
            <div><label class="block text-sm font-medium text-charcoal mb-1.5">Role</label>
              <select id="at-role" class="${input}">${TEAM_ROLES.map(r => `<option value="${r}" ${r === 'operations' ? 'selected' : ''}>${roleLabel(r)}</option>`).join('')}</select></div>
          </div>
          <div><label class="block text-sm font-medium text-charcoal mb-1.5">Temporary Password</label>
            <input id="at-pw" type="text" required minlength="6" autocomplete="off" class="${input}" placeholder="At least 6 characters" />
            <p class="text-xs text-muted mt-1.5">Share this with the staff member. There is no email reset for ID accounts.</p></div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="add-team-cancel" class="rounded-md border border-borderc px-4 py-2 text-sm text-charcoal hover:bg-cream">Cancel</button>
            <button type="submit" id="add-team-submit" class="rounded-md bg-forest px-4 py-2 text-sm font-medium text-white hover:bg-forest-dark disabled:opacity-60">Create Account</button>
          </div>
        </form>
      </div>
    </div>`;
}

function openAddTeamMemberModal() {
  document.getElementById('add-team-modal')?.remove();
  document.body.insertAdjacentHTML('beforeend', addTeamMemberModalHtml());
  const close = () => document.getElementById('add-team-modal')?.remove();
  document.getElementById('add-team-close').addEventListener('click', close);
  document.getElementById('add-team-cancel').addEventListener('click', close);
  document.getElementById('add-team-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errBox = document.getElementById('add-team-error');
    const showErr = (m) => { errBox.textContent = m; errBox.classList.remove('hidden'); };
    const name = document.getElementById('at-name').value.trim();
    const loginName = normalizeLoginName(document.getElementById('at-id').value);
    const department = document.getElementById('at-dept').value;
    const role = document.getElementById('at-role').value;
    const password = document.getElementById('at-pw').value;
    if (!/^[A-Z0-9][A-Z0-9._-]{2,}$/.test(loginName)) { showErr('Enter a valid ID Number (letters, numbers, dash), e.g. MTISI-00007.'); return; }
    if (password.length < 6) { showErr('Password must be at least 6 characters.'); return; }
    const btn = document.getElementById('add-team-submit');
    btn.disabled = true; btn.textContent = 'Creating...';
    let secAuth = null;
    try {
      if (!teamCreatorApp) teamCreatorApp = initializeApp(firebaseConfig, 'fms-team-creator');
      secAuth = getAuth(teamCreatorApp);
      const secDb = getFirestore(teamCreatorApp);
      const email = loginNameToEmail(loginName);
      const cred = await createUserWithEmailAndPassword(secAuth, email, password);
      // Written with the new account's own session, so the existing
      // "owner can create own profile" rule applies. No rules change needed.
      await setDoc(doc(secDb, 'users', cred.user.uid), {
        name, loginName, email, role, department, isActive: true,
        createdAt: serverTimestamp(),
        createdBy: currentUser ? currentUser.email : null,
      });
      await signOut(secAuth);
      close();
      renderTeamsPage();
    } catch (err) {
      console.error(err);
      if (secAuth) { try { await signOut(secAuth); } catch (_) {} }
      showErr(friendlyAuthError(err));
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  });
}

/* ---- Chart of Accounts (Settings) — Firestore-backed, fully editable ---- */
const ACCOUNT_TYPES = ['Asset', 'Contra-Asset', 'Liability', 'Equity', 'Revenue', 'Contra-Revenue', 'COGS', 'Expense', 'Other Income', 'Other Expense'];
let coaSeeded = false;
async function ensureChartOfAccountsSeeded() {
  if (coaSeeded) return;
  try {
    const existing = await fetchFinanceCollection('chartOfAccounts');
    if (!existing.length) {
      for (const acc of STANDARD_COA) {
        await createFinanceDoc('chartOfAccounts', { name: acc.name, code: acc.code, type: acc.type, status: 'Active', isSystem: true, standardKey: acc.code });
      }
    }
  } catch (e) { console.error(e); }
  coaSeeded = true;
}
// Account codes follow the standard chart's ranges: 1000s Assets, 2000s Liabilities, 3000s Equity, 4000s Revenue,
// 5000s Cost of Sales, 6000s Operating Expenses, 7000s Other Income / Expense.
function compareAccountsByCode(a, b) {
  return (a.code ? 0 : 1) - (b.code ? 0 : 1)
    || String(a.code || '').localeCompare(String(b.code || ''), undefined, { numeric: true })
    || String(a.name).localeCompare(String(b.name));
}
function coaCodeRange(type, name) {
  const n = String(name || '');
  switch (type) {
    case 'Asset': return /equipment|vehicle|furniture|fixture|building|machinery|\bland\b|leasehold/i.test(n) ? [1200, 1300] : [1000, 1200];
    case 'Contra-Asset': return [1200, 1300];
    case 'Liability': return /long.?term/i.test(n) ? [2200, 2300] : [2000, 2200];
    case 'Equity': return [3000, 4000];
    case 'Revenue': case 'Contra-Revenue': return [4000, 5000];
    case 'COGS': return [5000, 6000];
    case 'Expense': return [6000, 7000];
    case 'Other Income': return [7000, 7100];
    case 'Other Expense': return [7100, 8000];
    default: return [9000, 10000];
  }
}
// Next free code in the account's range, in steps of 10 after the highest one already used there.
function suggestAccountCode(type, name, usedCodes) {
  const [lo, hi] = coaCodeRange(type, name);
  const inRange = [...usedCodes].map(Number).filter(n => n >= lo && n < hi);
  let c = inRange.length ? Math.floor(Math.max(...inRange) / 10) * 10 + 10 : lo + 10;
  while (c < hi && usedCodes.has(String(c))) c += 10;
  if (c < hi) return String(c);
  for (c = lo + 1; c < hi; c++) if (!usedCodes.has(String(c))) return String(c);
  return '';
}
// Codes for accounts that don't have one yet: the standard code for the built-in accounts,
// otherwise the next free number in the account's range.
function planAccountCodes(accounts) {
  const used = new Set(accounts.map(a => a.code).filter(Boolean).map(String));
  const standardByName = Object.fromEntries(STANDARD_COA.map(s => [s.name, s.code]));
  const missing = accounts.filter(a => !a.code && a.status !== 'Inactive').sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const plan = [];
  const give = (a, code) => { if (code) { used.add(code); plan.push({ id: a.id, name: a.name, code }); } };
  missing.filter(a => standardByName[a.name] && !used.has(standardByName[a.name])).forEach(a => give(a, standardByName[a.name]));
  const done = new Set(plan.map(p => p.id));
  missing.filter(a => !done.has(a.id)).forEach(a => give(a, suggestAccountCode(a.type, a.name, used)));
  return plan;
}

// ---- moving an existing chart over to the standard chart ----
function normAccountName(s) {
  return String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[–—−]/g, '-').replace(/\s+/g, ' ').trim();
}
// Every standard account is on file, so the standard chart has been applied (later edits don't undo that).
function isStandardChartApplied(accounts) {
  return STANDARD_COA.every(s => accounts.some(a => a.standardKey === s.code));
}
// What it would take to make the saved chart match the standard chart. Nothing is deleted: accounts
// that aren't in the standard chart are set to Inactive and lose their code, so past entries keep their name.
function planStandardChart(accounts) {
  if (isStandardChartApplied(accounts)) return { pending: false, updates: [], creates: [], retire: [] };
  const renamed = {};
  Object.entries(LEGACY_ACCOUNT_RENAMES).forEach(([o, n]) => { renamed[normAccountName(o)] = n; });
  const claimed = new Set(), updates = [], creates = [];
  STANDARD_COA.forEach(s => {
    const want = normAccountName(s.name);
    const hit = accounts.find(a => !claimed.has(a.id) && a.standardKey === s.code)
      || accounts.find(a => !claimed.has(a.id) && !a.standardKey && normAccountName(renamed[normAccountName(a.name)] || a.name) === want);
    if (!hit) { creates.push({ ...s }); return; }
    claimed.add(hit.id);
    const patch = {};
    if (hit.name !== s.name) patch.name = s.name;
    if (String(hit.code || '') !== s.code) patch.code = s.code;
    if (hit.type !== s.type) patch.type = s.type;
    if (hit.status === 'Inactive') patch.status = 'Active';
    if (hit.standardKey !== s.code) patch.standardKey = s.code;
    if (Object.keys(patch).length) updates.push({ id: hit.id, from: hit.name, to: s.name, patch });
  });
  const retire = accounts
    .filter(a => !claimed.has(a.id) && !a.standardKey && !(a.legacy && a.status === 'Inactive' && !a.code))
    .map(a => ({ id: a.id, name: a.name, wasActive: a.status !== 'Inactive', patch: { status: 'Inactive', code: '', legacy: true } }));
  return { pending: true, updates, creates, retire };
}
async function applyStandardChart(plan, onProgress) {
  const total = plan.updates.length + plan.creates.length + plan.retire.length;
  let done = 0;
  const tick = () => { done += 1; if (onProgress) onProgress(done, total); };
  for (const u of plan.updates) { await updateFinanceDoc('chartOfAccounts', u.id, u.patch); tick(); }
  for (const c of plan.creates) {
    await createFinanceDoc('chartOfAccounts', { name: c.name, code: c.code, type: c.type, status: 'Active', isSystem: true, standardKey: c.code });
    tick();
  }
  for (const r of plan.retire) { await updateFinanceDoc('chartOfAccounts', r.id, r.patch); tick(); }
}
async function backfillAccountCodes(accounts) {
  const plan = planAccountCodes(accounts);
  for (const p of plan) {
    await updateFinanceDoc('chartOfAccounts', p.id, { code: p.code });
    const acc = accounts.find(a => a.id === p.id);
    if (acc) acc.code = p.code;
  }
  return plan.length;
}
function coaCodeProblem(code, accounts, selfId) {
  if (!/^\d{3,6}$/.test(code)) return 'Use 3 to 6 digits for the code, for example 1010.';
  const clash = accounts.find(a => a.id !== selfId && String(a.code || '') === code);
  return clash ? `Code ${code} is already used by ${clash.name}.` : null;
}
function applyAccountsChart(accounts) {
  accounts = [...accounts].sort(compareAccountsByCode);
  Object.keys(ACCOUNT_CODE_BY_NAME).forEach(k => delete ACCOUNT_CODE_BY_NAME[k]);
  Object.keys(ACCOUNT_TYPE_BY_NAME).forEach(k => delete ACCOUNT_TYPE_BY_NAME[k]);
  accounts.forEach(a => {
    if (a.code) ACCOUNT_CODE_BY_NAME[a.name] = a.code;
    ACCOUNT_TYPE_BY_NAME[a.name] = a.type;
  });
  const active = accounts.filter(a => a.status !== 'Inactive');
  const names = active.map(a => a.name);
  ACCOUNTS_CHART.length = 0;
  ACCOUNTS_CHART.push(...names);
  EXPENSE_ACCOUNTS.length = 0;
  EXPENSE_ACCOUNTS.push(...active.filter(a => EXPENSE_ACCOUNT_TYPES.includes(a.type)).map(a => a.name));
  CASH_OFFSET_ACCOUNTS.length = 0;
  CASH_OFFSET_ACCOUNTS.push(...ACCOUNTS_CHART.filter(a => !CASH_LIKE_ACCOUNTS.includes(a)));
}
async function refreshAccountsChartFromFirestore() {
  await ensureChartOfAccountsSeeded();
  try {
    const accounts = await fetchFinanceCollection('chartOfAccounts');
    if (accounts.length) {
      try { await backfillAccountCodes(accounts); } catch (e) { console.error(e); }
      applyAccountsChart(accounts);
    }
  } catch (e) { console.error(e); }
}
function coaSectionFor(code) {
  const n = parseInt(code, 10);
  return Number.isFinite(n) ? COA_SECTIONS.find(sec => n >= sec.from && n <= sec.to) || null : null;
}

      <p class="text-sm text-muted mt-1">System Admin can always approve any amount. Set a peso limit for Finance Manager — requests above it will only show an Approve button to a System Admin.</p>
    </div>
    <form id="rules-form" class="card p-6 space-y-4 max-w-md">
      <div id="rules-form-error" class="hidden text-sm bg-red-50 border border-red-200 text-red-700 rounded-md px-3 py-2"></div>
      <div class="flex items-center gap-2">
        <input id="rules-no-limit" type="checkbox" class="rounded border-borderc text-forest focus:ring-forest" ${approvalRulesCache.financeManagerLimit == null ? 'checked' : ''} />
        <label for="rules-no-limit" class="text-sm text-charcoal">No limit (Finance Manager can approve any amount)</label>
      </div>
      <div id="rules-limit-wrap" class="${approvalRulesCache.financeManagerLimit == null ? 'hidden' : ''}">
        ${numberField('financeManagerLimit', 'Finance Manager Approval Limit (₱)', { step: '0.01', value: approvalRulesCache.financeManagerLimit || '' })}
      </div>
      <button id="rules-submit" type="submit" class="btn-primary text-sm"><span id="rules-submit-text">Save</span></button>
    </form>`);
  refreshIcons();

  const noLimitCheckbox = document.getElementById('rules-no-limit');
  const limitWrap = document.getElementById('rules-limit-wrap');
  noLimitCheckbox.addEventListener('change', () => {
    limitWrap.classList.toggle('hidden', noLimitCheckbox.checked);
  });

  document.getElementById('rules-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('rules-submit');
    const btnText = document.getElementById('rules-submit-text');
    const errBox = document.getElementById('rules-form-error');
    errBox.classList.add('hidden');
    const noLimit = noLimitCheckbox.checked;
    const limitField = document.getElementById('field-financeManagerLimit');
    const limitValue = noLimit ? null : (Number(limitField.value) || 0);

    btn.disabled = true; btnText.innerHTML = spinnerHtml();
    try {
      await setDoc(doc(db, 'settings', 'approvalRules'), { financeManagerLimit: limitValue, updatedAt: serverTimestamp(), updatedBy: currentUser ? currentUser.email : null }, { merge: true });
      approvalRulesCache = { financeManagerLimit: limitValue };
      renderApprovalRulesPage();
    } catch (err) {
      console.error(err);
      errBox.textContent = 'Could not save. Please try again.';
      errBox.classList.remove('hidden');
      btn.disabled = false; btnText.textContent = 'Save';
    }
  });
}

/* ==========================================================================
   AUTH BOOTSTRAP
   ========================================================================== */
async function isFirstAccount() {
  try {
    const existing = await getDocs(query(collection(db, 'users'), limit(1)));
    return existing.empty;
  } catch (e) {
    console.warn('Could not check for existing users, defaulting role to operations.', e);
    return false;
  }
}

async function ensureUserProfile(user) {
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    return snap.data();
  }

  // Reached only if a profile doc wasn't already created at sign-up time
  // (e.g. an account created directly in the Firebase console). Same
  // first-account-becomes-admin rule applies here too.
  const isFirstUser = await isFirstAccount();
  const profile = {
    name: loginNameFromEmail(user.email) || user.email.split('@')[0],
    loginName: loginNameFromEmail(user.email) || null,
    email: user.email,
    role: isFirstUser ? 'system_admin' : 'operations',
    department: isFirstUser ? 'Administration' : 'Operations',
    isActive: true,
    createdAt: serverTimestamp(),
  };
  await setDoc(ref, profile);
  return profile;
}

function initRouter() {
  window.addEventListener('hashchange', renderRoute);
  if (!window.location.hash) window.location.hash = '#/' + landingPath();
  renderRoute();
}

async function bootstrap() {
  if (!firebaseReady) {
    renderLogin();
    return;
  }
  renderLoading();
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      try {
        currentProfile = await ensureUserProfile(user);
      } catch (e) {
        console.error('Could not load/create user profile:', e);
        currentProfile = { name: user.email, email: user.email, role: 'operations', department: 'Operations', isActive: true };
      }
      renderShell();
      initRouter();
      refreshAccountsChartFromFirestore();
      loadApprovalRules();
    } else {
      currentUser = null;
      currentProfile = null;
      renderLogin();
    }
  });
}

bootstrap();
</script>
